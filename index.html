    ['REPORTING',[['v15_reports','📊','Report Center'],['reports','📈','Reports'],['reports_mealwise','🍽️','Meal-wise Summary'],['reports_compare','🔀','Comparison'],['analytics','📉','Analytics']]],
    ['COMMUNICATION',[['announcements','📢','Announcements'],['popups','💬','Popup Messages'],['notifications','🔔','Notifications']]],
    ['MASTER & CONTROL',[['categories','🏷️','Categories'],['timings','⏰','Mess Timings'],['rates','💰','Paid Meal Rates'],['users','🔐','Users'],['audit','📋','Audit Log'],['v15_config','⚙️','Configuration Center'],['settings','🔧','System Settings'],['export','📤','Backup / Export']]]
  );
}catch(e){console.warn('v15 navigation upgrade failed',e);}

v15EnsureConfig();

function showPublic(){
  $('#app').classList.add('hide');
  $('#pub').classList.remove('hide');
  document.body.classList.remove('side-collapsed');
  publicPage();
}
function showAdmin(){
  $('#pub').classList.add('hide');
  $('#app').classList.remove('hide');
  adminShell();
  const t = DataService.raw().settings.theme;
  if(t && t!=='auto') document.documentElement.dataset.theme = t;
}

document.addEventListener('keydown', e => { if(e.key==='Escape'){ App.close(); closePopup(); IP.closeMobileMenu(); } });

/* ============================================================
   FAST STARTUP
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  if(!document.documentElement.dataset.theme){
    document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  const hideLoader = () => {
    const el = document.getElementById('load');
    if(!el) return;
    el.classList.add('out');
    setTimeout(()=>{ el.style.display='none'; }, 400);
  };

  const showUI = () => {
    try{
      if(Auth.restore()){ showAdmin(); App.go('dashboard'); }
      else showPublic();
    }catch(e){ console.warn('UI render error', e); showPublic(); }
  };

  setTimeout(() => {
    hideLoader();
    showUI();
  }, 150);

  const onSync = () => {
    try{
      if(currentUser){ Auth.refresh(); App.go(App.page||'dashboard'); }
      else publicPage();
    }catch(e){}
  };
  if(DataService.hasInitialSync()) {
    setTimeout(onSync, 300);
  } else {
    window.addEventListener('ipak-initial-sync-done', () => setTimeout(onSync, 200), {once:true});
  }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if(window.innerWidth <= 900){
      IP.closeMobileMenu();
    } else {
      const side = document.getElementById('sideBar');
      const overlay = document.getElementById('sideOverlay');
      if(side) side.classList.remove('on');
      if(overlay) overlay.classList.remove('on');
      document.body.style.overflow = '';
      try{
        if(localStorage.getItem('ipakSideCollapsed') === '1'){
          document.body.classList.add('side-collapsed');
        } else {
          document.body.classList.remove('side-collapsed');
        }
      }catch(e){}
    }
  }, 150);
});

window.addEventListener('firebase-connection', (e)=>{
  const badge = document.getElementById('syncBadge');
  if(badge){
    const connected = e.detail && e.detail.connected;
    badge.textContent = connected ? '🟢 Live Sync' : '⚪ Offline';
    badge.className = 'sync-badge ' + (connected ? 'on' : 'off');
  }
});

let renderDebounce = null;
window.addEventListener('ipak-data-changed', (e)=>{
  clearTimeout(renderDebounce);
  renderDebounce = setTimeout(()=>{
    try{
      if(currentUser){
        Auth.refresh();
        const activePage = App.page;
        if(['dashboard','daily','reports','reports_daily','menu','monthly','complaints',
            'feedback','waste','water','bread','announcements','popups','users','audit','rates',
            'categories','notifications','analytics','reports_mealwise','reports_compare','v15_operations','v15_reports','v15_config'].includes(activePage)){
          App.go(activePage);
        }
      } else {
        publicPage();
      }
    }catch(err){ console.warn('Live re-render failed', err); }
  }, 350);
});

// Keep the public employee menu current even if a Firestore snapshot is delayed.
let employeeMenuTimer = null;
function startEmployeeMenuRefresh(){
  clearInterval(employeeMenuTimer);
  employeeMenuTimer = setInterval(refreshEmployeeMenu, 15000);
}
startEmployeeMenuRefresh();

// Start the dedicated employee menu listener as soon as Firebase becomes ready.
window.addEventListener('firebase-connection', ()=>{
  if(!currentUser && DataService.isFirebaseReady()) startEmployeeMenuRealtime();
});

setInterval(()=>{
  if(DataService.isFirebaseReady() && !document.hidden){
    DataService.forceRefresh().catch(()=>{});
  }
}, 90000);

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && DataService.isFirebaseReady()){
    if(!currentUser) {
      startEmployeeMenuRealtime();
      refreshEmployeeMenu();
    } else {
      DataService.forceRefresh().catch(()=>{});
    }
  }
});

if('serviceWorker' in navigator){
  const sw = `self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>self.clients.claim());
self.addEventListener('fetch',e=>{e.respondWith(caches.open('ipak').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch(_){} return res}).catch(()=>c.match('/')))))});`;
  try{
    const blob = new Blob([sw], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}

})();
</script>
