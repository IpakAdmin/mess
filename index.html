<style>
:root{
  --p:#0f4c5c;--p2:#177e93;--ac:#e67e22;--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;
  --ok:#10b981;--wa:#f59e0b;--er:#ef4444;--side:#0a2f3a;--sh:0 2px 8px #0001;
}
[data-theme=dark]{
  --bg:#0b1620;--card:#132532;--tx:#e6eef3;--mu:#94a3b8;--bd:#25394a;--side:#06202a;--sh:0 2px 10px #0006;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:14px/1.4 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
img,svg{max-width:100%}

button, .btn, a, .qa button, .qa-item, .cat-chip, .menu-day, .meal, .kpi, .rate-card,
.qa-card, .day-entry, .alert, .perm-item, input, select, textarea, label{ transition: all .18s ease; }
input:hover, select:hover, textarea:hover{ border-color: var(--p2); box-shadow: 0 0 0 3px #177e9318; }
input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--p2); box-shadow: 0 0 0 4px #177e9322; transform: translateY(-1px); }
.btn:hover, button:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px #0002; filter:brightness(1.08); }
.btn:active, button:active{ transform: translateY(0); box-shadow: 0 2px 6px #0002; }
.qa button:hover, .qa-item:hover{ transform: translateY(-3px); }
.cat-chip:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px #0002; }
.kpi:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px #0002; }
.meal:hover, .menu-day:hover, .rate-card:hover, .qa-card:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px #0002; }
.day-entry:hover{ border-color: var(--p2); box-shadow: 0 4px 12px #0001; }
.side a:hover{ padding-left: 16px; }

#load{position:fixed;inset:0;background:linear-gradient(135deg,#0a2f3a 0%,#177e93 55%,#e67e22 130%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;transition:opacity .6s}
#load.out{opacity:0;pointer-events:none}
#load .kitchen{position:relative;width:180px;height:120px;display:flex;align-items:flex-end;justify-content:center;gap:8px}
#load .pan{width:70px;height:34px;border-radius:0 0 34px 34px;background:#2c2c2c;position:relative;box-shadow:inset 0 -3px 0 #000}
#load .pan:after{content:"";position:absolute;right:-24px;bottom:8px;width:28px;height:6px;background:#2c2c2c;border-radius:4px}
#load .chef{font-size:46px;animation:chef 1.4s ease-in-out infinite}
#load .steam{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;gap:4px}
#load .steam i{width:5px;height:22px;background:#fff7;border-radius:3px;animation:steam 1.6s ease-in-out infinite}
#load .steam i:nth-child(2){animation-delay:.3s}
#load .steam i:nth-child(3){animation-delay:.6s}
#load b.brand{font-size:52px;letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,#fff,#ffd9a8);-webkit-background-clip:text;background-clip:text;color:transparent}
#load .tag{font-size:15px;font-weight:600;opacity:.9}
#load .slogan{font-size:12px;letter-spacing:1px;opacity:.75;font-style:italic}
#load .bar{width:240px;height:5px;background:#fff3;border-radius:9px;overflow:hidden;margin-top:6px}
#load .bar:after{content:"";display:block;height:100%;background:var(--ac);animation:pg 1.4s forwards}
@keyframes chef{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px) scaleY(.6)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px) scaleY(1.2)}}
@keyframes pg{from{width:0}to{width:100%}}

.btn{border:0;background:var(--p);color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;min-height:36px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.btn.s{background:var(--bd);color:var(--tx)}
.btn.d{background:var(--er)}
.btn.a{background:var(--ac)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:5px 9px;font-size:12px;min-height:28px}
.btn.block{width:100%;justify-content:center}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);transition:.15s;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:var(--p2)}
input:invalid{border-color:var(--er)}
input[readonly]{background:var(--bg);font-weight:700;color:var(--ok)}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.req:after{content:" *";color:var(--er)}
.hint{font-size:11px;color:var(--mu);margin-top:3px}

.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--sh);margin-bottom:16px;overflow-x:auto}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3 .h3l{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fg .f{grid-column:span 2}
.fg>div{min-width:0}
@media(max-width:640px){.fg{grid-template-columns:1fr}.fg .f{grid-column:auto}}

.tbl-wrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:.5px;background:var(--card);position:sticky;top:0;z-index:1}
tbody tr:hover{background:#177e9308}
tbody tr:last-child td{border-bottom:0}
tr.rev-row td{background:#10b98115;font-weight:700}
tr.selected-row td{background:#177e9318 !important}

input[type="checkbox"].row-check,
input[type="checkbox"].select-all-check{
  width:16px;height:16px;padding:0;accent-color:var(--p2);cursor:pointer;
  margin:0;box-shadow:none !important;transform:none !important;
}
input[type="checkbox"].row-check:hover,
input[type="checkbox"].select-all-check:hover{
  transform:scale(1.15) !important;box-shadow:none !important;
  border-color:transparent;
}

.bulk-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(135deg,#0f4c5c,#177e93);color:#fff;
  padding:10px 14px;border-radius:10px;margin-bottom:12px;
  box-shadow:0 4px 14px #0f4c5c30;
  animation:bulkIn .25s ease;
}
@keyframes bulkIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.bulk-bar .bulk-count{ font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px; }
.bulk-bar .bulk-count b{ background:#fff;color:var(--p);padding:2px 10px;border-radius:99px; font-size:13px;min-width:26px;text-align:center; }
.bulk-bar .bulk-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bulk-bar .btn{background:#ffffff22;color:#fff;border:1px solid #ffffff33}
.bulk-bar .btn:hover{background:#ffffff33;border-color:#ffffff66}
.bulk-bar .btn.d{background:#ef4444cc;border-color:#ef4444}
.bulk-bar .btn.d:hover{background:#ef4444}
.bulk-bar .btn.ok{background:#10b981cc;border-color:#10b981}
.bulk-bar .btn.ok:hover{background:#10b981}

.tag{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#17709a22;color:var(--p2);display:inline-block}
.tag.g{background:#10b98122;color:var(--ok)}
.tag.r{background:#ef444422;color:var(--er)}
.tag.y{background:#f59e0b22;color:var(--wa)}
.tag.gray{background:#64748b22;color:var(--mu)}
.tag.money{background:#10b98122;color:var(--ok);font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;padding:14px;border-left:4px solid var(--p2);box-shadow:var(--sh);position:relative}
.kpi small{color:var(--mu);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;line-height:1.1}
.kpi .v small{font-size:12px;margin-left:6px;font-weight:600}
.kpi.g{border-left-color:var(--ok)}.kpi.y{border-left-color:var(--wa)}.kpi.r{border-left-color:var(--er)}
.kpi.money{border-left-color:#10b981}
.kpi .sub{font-size:10px;color:var(--mu);margin-top:2px;text-transform:none;letter-spacing:0;font-weight:600}

#pub{min-height:100vh;background:linear-gradient(160deg,#0a2f3a 0%,#177e93 60%,#e67e22 130%);padding:18px;color:#fff}
.pw{max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.greet{font-size:13px;opacity:.9;margin-top:3px}

.admin-login-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.35);
  padding:10px 18px;border-radius:10px;
  font-weight:700;font-size:14px;cursor:pointer;
  backdrop-filter:blur(6px);transition:all .2s ease;letter-spacing:.3px;
}
.admin-login-btn:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6);transform:translateY(-2px);box-shadow:0 8px 20px #0003;}
.admin-login-btn:active{ transform:translateY(0); box-shadow:0 2px 6px #0002; }
.admin-login-btn .ali{ font-size:16px; }

.ann{background:#fff2;border-radius:14px;padding:18px;margin:18px 0;border:1px solid #fff3;backdrop-filter:blur(6px)}
.ann h2{margin:0 0 6px;font-size:17px}
.ann .p{font-size:11px;font-weight:800;letter-spacing:1px;opacity:.85}
.pub-card{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.pub-card h3{margin:0 0 10px;color:var(--tx)}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.meal{border:1px solid var(--bd);border-radius:10px;padding:12px;position:relative}
.meal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.meal b{color:var(--p2);font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.meal .items{font-size:13px;line-height:1.4;color:var(--tx);margin-bottom:6px}
.meal small{color:var(--mu);font-size:11px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.qa button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:4px}
.qa button:hover{border-color:var(--ac);transform:translateY(-1px)}
.qa button .qai{font-size:18px;line-height:1}

.support-box{margin-top:18px;background:var(--card);color:var(--tx);border-radius:14px;padding:16px;box-shadow:var(--sh);}
.support-box h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--p2)}
.support-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);margin-bottom:8px;transition:.18s ease;text-decoration:none;color:var(--tx)}
.support-line:hover{background:#10b98115;transform:translateX(4px);box-shadow:0 4px 12px #0001}
.support-line .si{font-size:22px}
.support-line .sl-t{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.support-line .sl-v{font-size:14px;font-weight:800;color:var(--ok)}

#app{display:flex;min-height:100vh}
.side{width:240px;background:var(--side);color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.side h2{font-size:16px;margin:4px 8px 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;font-size:13px;transition:.15s;text-decoration:none}
.side a:hover{background:#fff1;color:#fff}
.side a.on{background:var(--ac);color:#fff;font-weight:700}
.side .sec{font-size:10px;letter-spacing:1.5px;color:#7c98a5;margin:14px 10px 4px;font-weight:700;text-transform:uppercase}
.side .qa-menu{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.side .qa-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:#ffffff10;color:#e2e8f0;cursor:pointer;font-size:12px;font-weight:600;border:1px solid #ffffff15;transition:.15s}
.side .qa-item:hover{background:#e67e2233;border-color:var(--ac);color:#fff}
.main{flex:1;min-width:0;padding:18px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.hd h2{margin:0;font-size:20px}
.hd .hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bc{font-size:12px;color:var(--mu);margin-bottom:6px}
.bc b{color:var(--tx)}

.sync-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;
  background:#64748b22;color:var(--mu);transition:.2s;
}
.sync-badge.on{background:#10b98122;color:var(--ok)}
.sync-badge.syncing{background:#f59e0b22;color:var(--wa)}
.sync-badge.off{background:#ef444422;color:var(--er)}

.mobile-menu-btn {
  display: none;
  background: var(--p);
  color: #fff;
  border: 0;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 20px;
  align-items: center;
  justify-content: center;
  transition: .2s;
  flex-shrink: 0;
  line-height: 1;
}
.mobile-menu-btn:hover { background: var(--p2); transform: translateY(-1px); box-shadow: 0 4px 12px #0002; }
.mobile-menu-btn:active { transform: translateY(0); }

.side-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 998;
  opacity: 0;
  transition: opacity .25s ease;
}
.side-overlay.on { display: block; opacity: 1; }

.side-close {
  display: none;
  position: absolute;
  top: 12px; right: 12px;
  background: transparent; border: 0; color: #fff;
  font-size: 16px; cursor: pointer;
  width: 34px; height: 34px; border-radius: 50%;
  align-items: center; justify-content: center;
  transition: .2s; z-index: 2; line-height: 1;
}
.side-close:hover { background: #ffffff22; transform: rotate(90deg); box-shadow: none; filter: none; }

.modal {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 12px;
  animation: modalFade .22s ease;
}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.mc{background:var(--card);border-radius:14px;padding:20px;width:min(680px,100%);max-height:92dvh;overflow:auto;box-shadow:0 20px 60px #0007;animation:mcin .3s ease}
@keyframes mcin{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.mc h3{margin:0 0 12px;font-size:18px}
.mc.wide{width:min(900px,100%)}

.mc:has(.login-modal), .mc.login-modal {
  width: auto !important;
  max-width: min(380px, 94vw) !important;
  padding: 0 !important;
  overflow: hidden !important;
  border-radius: 18px !important;
}
.login-modal{
  padding:0 !important; overflow:hidden !important;
  width:100%; max-width:min(380px,94vw);
  position:relative; display:flex; flex-direction:column;
  border-radius:18px !important; background:var(--card);
  box-shadow:0 25px 70px #0008, 0 0 0 1px #ffffff08 !important;
  animation:mcin .28s ease;
}
.login-modal .lm-close{
  position:absolute;top:12px;right:12px;
  background:transparent;border:0;color:var(--mu);
  font-size:16px;cursor:pointer;font-weight:700;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;line-height:1;z-index:5;
}
.login-modal .lm-close:hover{background:#ef444418;color:var(--er);transform:rotate(90deg)}

.login-modal .lm-form-panel{ padding:28px 24px 18px; background:var(--card); color:var(--tx); display:flex;flex-direction:column; width:100%; }
.login-modal .lm-form-head{ text-align:center; margin-bottom:18px; }
.login-modal .lm-form-icon{ width:52px;height:52px;margin:0 auto 10px;border-radius:14px; display:grid;place-items:center;font-size:24px; background:linear-gradient(135deg,#0f4c5c,#177e93); box-shadow:0 6px 18px #0f4c5c40; }
.login-modal .lm-form-kicker{ font-size:9px;font-weight:900;letter-spacing:1.6px;color:var(--p2); }
.login-modal .lm-form-head h3{ margin:5px 0 3px;font-size:19px;line-height:1.2; letter-spacing:-.2px;color:var(--tx);font-weight:800; }
.login-modal .lm-form-head p{ margin:0;color:var(--mu);font-size:12px; }
.login-modal .lm-field{margin-bottom:12px}
.login-modal .lm-field label{ font-size:11px !important;font-weight:800 !important; color:var(--tx) !important;margin:0 0 5px !important; text-transform:none !important;letter-spacing:.1px !important; }
.login-modal .lm-input{position:relative}
.login-modal .lm-input .lm-ico{ position:absolute;left:11px;top:50%;transform:translateY(-50%); font-size:14px;opacity:.6;pointer-events:none; }
.login-modal .lm-input input{ height:40px !important; padding:8px 40px 8px 34px !important; border-radius:10px !important; background:var(--bg) !important; border:1px solid var(--bd) !important; font-size:13px !important; width:100% !important; }
.login-modal .lm-input input#lm_u{padding-right:12px !important}
.login-modal .lm-input input:focus{ background:var(--card) !important; box-shadow:0 0 0 3px #177e9320 !important; }
.login-modal .lm-input .toggle-password{ position:absolute;right:6px;top:50%;transform:translateY(-50%); background:none;border:none;cursor:pointer; color:var(--mu);border-radius:8px;font-size:15px;padding:5px 7px; }
.login-modal .lm-input .toggle-password:hover{ background:var(--bd);transform:translateY(-50%) !important; }
.login-modal .lm-caps{ display:none;margin-top:5px;font-size:11px;color:var(--wa);font-weight:700; }

const DataService = (()=>{

    'users','reports','menu','timings','complaints','feedback','waste',

      reports:[], menu:[],

      announcements:[], notifications:[], popupMessages:[], audit:[],
      categories:{meal:['Breakfast','Morning Tea','Lunch','Evening Tea','Dinner','Midnight Tea'],paidMealCat:Object.keys(rates),food:['Grains','Meat','Pulses','Dairy','Vegetables','Cooking','Beverages','Groceries','Other'],complaint:['Food Quality','Taste','Quantity','Hygiene','Timing','Service','Menu','Other'],wasteReason:['Overcooking','Low turnout','Spoiled','Customer return','Other'],unit:['KG','L','Pcs','Pkt','Dozen','Tin'],announcement:['General','Menu Change','Timing Update','Holiday','Maintenance']},

        {id:'QA9',label:'Monthly Menu',icon:'🗓️',meal:'',action:'Info Only',audience:'Employee',order:9,enabled:'Yes',createdAt:nowISO()},

  function clone(v){try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}}

  function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(DB));}catch(e){console.warn('Local save failed',e);}}
  function normalize(){
    COLLECTIONS.filter(c=>c!=='audit').forEach(k=>{if(!Array.isArray(DB[k])) DB[k]=DB[k]&&typeof DB[k]==='object'?Object.values(DB[k]):[];});
    if(!Array.isArray(DB.audit)) DB.audit=DB.audit&&typeof DB.audit==='object'?Object.values(DB.audit):[];
    if(!DB.categories||typeof DB.categories!=='object'||Array.isArray(DB.categories)) DB.categories={};
    if(!DB.paidMealRates||typeof DB.paidMealRates!=='object'||Array.isArray(DB.paidMealRates)) DB.paidMealRates={};
    if(!DB.settings||typeof DB.settings!=='object') DB.settings={};
    if(!DB.meta||typeof DB.meta!=='object') DB.meta={version:11};
  }

  function col(name){return collection(window.__IPAK_FIRESTORE,name);}
  function docRef(name,id){return doc(col(name),String(id));}

  async function readCollection(name){
    const snap=await getDocs(col(name));
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  }
  async function readConfig(name){
    const snap=await getDoc(docRef(name,'config'));
    return snap.exists()?snap.data():null;
  }
  async function writeRecord(collName,rec){
    const data={...clone(rec),updatedAt:serverTimestamp()};
    await setDoc(docRef(collName,rec.id),data,{merge:true});
  }
  async function deleteRecord(collName,id){await deleteDoc(docRef(collName,id));}

  async function seedFirestore(){
    const existingUsers=await getDocs(col('users'));
    if(!existingUsers.empty) return false;
    const fresh=seed();
    const batch=writeBatch(window.__IPAK_FIRESTORE);
    for(const c of COLLECTIONS.filter(x=>x!=='audit')){
      const arr=Array.isArray(fresh[c])?fresh[c]:[];
      for(const r of arr) if(r&&r.id) batch.set(docRef(c,r.id),clone(r));
    }
    for(const r of fresh.audit||[]) if(r&&r.id) batch.set(docRef('audit',r.id),clone(r));
    batch.set(docRef('meta','config'),clone(fresh.meta));
    batch.set(docRef('settings','config'),clone(fresh.settings));
    batch.set(docRef('categories','config'),clone(fresh.categories));
    batch.set(docRef('paidMealRates','config'),clone(fresh.paidMealRates));
    await batch.commit();
    return true;
  }

  async function loadAllRemote(){
    const fresh=seed();
    for(const c of COLLECTIONS){
      if(c==='audit') fresh.audit=await readCollection('audit');
      else fresh[c]=await readCollection(c);
    }
    const meta=await readConfig('meta'); if(meta) fresh.meta=meta;
    const settings=await readConfig('settings'); if(settings) fresh.settings=settings;
    const categories=await readConfig('categories'); if(categories) fresh.categories=categories;
    const rates=await readConfig('paidMealRates'); if(rates) fresh.paidMealRates=rates;
    DB=fresh; normalize(); saveLocal();
  }

  function attachListeners(){
    listeners.forEach(un=>{try{un();}catch(e){}}); listeners=[];
    for(const c of COLLECTIONS){
      const un=onSnapshot(col(c),snap=>{
        if(!DB) return;
        DB[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
        normalize(); saveLocal(); notifyChange(c);
      },err=>console.warn('Firestore listener',c,err));
      listeners.push(un);
    }
    for(const c of CONFIG_COLLECTIONS){
      const un=onSnapshot(docRef(c,'config'),snap=>{
        if(!DB||!snap.exists()) return;
        DB[c==='meta'?'meta':c]=snap.data(); normalize(); saveLocal(); notifyChange(c);
      },err=>console.warn('Firestore config listener',c,err));
      listeners.push(un);
    }
  }

  async function bootFirebase(){
    try{
      if(!window.__IPAK_FIRESTORE_READY) await new Promise(r=>{const f=()=>r();window.addEventListener('firebase-ready',f,{once:true});setTimeout(r,5000);});
      if(!window.__IPAK_FIRESTORE) throw new Error('Firestore is not initialized');
      fbReady=true;
      await seedFirestore();
      await loadAllRemote();
      attachListeners();
      fbConnected=true;
      initialSyncDone=true;
      window.dispatchEvent(new CustomEvent('firebase-connection',{detail:{connected:true}}));
      window.dispatchEvent(new Event('ipak-initial-sync-done'));
      return true;
    }catch(e){console.warn('Firestore boot failed:',e);fbConnected=false;initialSyncDone=true;window.dispatchEvent(new CustomEvent('firebase-connection',{detail:{connected:false}}));window.dispatchEvent(new Event('ipak-initial-sync-done'));return false;}
  }

  function bootLocal(){DB=loadLocal()||seed();normalize();saveLocal();}
  function notifyChange(coll){
    try{ window.dispatchEvent(new CustomEvent('ipak-data-changed',{detail:{coll}})); }catch(e){}
  }

  function all(coll){return DB[coll]||[];}
  function get(coll,id){return all(coll).find(r=>r.id===id)||null;}

  function insert(coll,rec){
    rec={...rec}; rec.id=rec.id||uid((coll||'x')[0].toUpperCase()); rec.createdAt=rec.createdAt||nowISO(); rec.updatedAt=nowISO();
    if(!DB[coll]) DB[coll]=[];
    DB[coll].push(rec); saveLocal(); notifyChange(coll);
    if(fbReady) writeRecord(coll,rec).catch(e=>console.warn('Firestore write failed',coll,rec.id,e));
    return rec;
  }
  function update_(coll,id,patch){
    const r=get(coll,id); if(!r)return null; Object.assign(r,patch,{updatedAt:nowISO()}); saveLocal(); notifyChange(coll);
    if(fbReady) writeRecord(coll,r).catch(e=>console.warn('Firestore update failed',coll,id,e)); return r;
  }
  function remove_(coll,id){
    DB[coll]=(DB[coll]||[]).filter(r=>r.id!==id); saveLocal(); notifyChange(coll);
    if(fbReady) deleteRecord(coll,id).catch(e=>console.warn('Firestore delete failed',coll,id,e));
  }
  function removeMany_(coll,ids){
    if(!Array.isArray(ids)||!ids.length)return 0; const set=new Set(ids), before=(DB[coll]||[]).length; DB[coll]=(DB[coll]||[]).filter(r=>!set.has(r.id)); saveLocal(); notifyChange(coll);
    if(fbReady) Promise.all(ids.map(id=>deleteRecord(coll,id))).catch(e=>console.warn('Firestore bulk delete failed',e)); return before-DB[coll].length;
  }

  async function replaceAll(newDB){
    DB=clone(newDB||seed()); normalize(); saveLocal();
    for(const c of COLLECTIONS){
      const existing=await getDocs(col(c)); const batch=writeBatch(window.__IPAK_FIRESTORE); existing.forEach(d=>batch.delete(d.ref)); await batch.commit();
      const arr=Array.isArray(DB[c])?DB[c]:[];
      for(let i=0;i<arr.length;i+=400){const b=writeBatch(window.__IPAK_FIRESTORE);arr.slice(i,i+400).forEach(r=>{if(r&&r.id)b.set(docRef(c,r.id),clone(r));});await b.commit();}
    }
    await syncConfig('meta',DB.meta); await syncConfig('settings',DB.settings); await syncConfig('categories',DB.categories); await syncConfig('paidMealRates',DB.paidMealRates); notifyChange('*');
  }

  function raw(){return DB;}
  function getCats(key){return DB.categories?.[key]||[];}
  function syncConfig(key,value){DB[key]=value;saveLocal();if(fbReady)return setDoc(docRef(key,'config'),clone(value),{merge:false}).catch(e=>console.warn('Firestore config write failed',key,e));}
  function addCat(key,val){if(!DB.categories)DB.categories={};if(!DB.categories[key])DB.categories[key]=[];if(DB.categories[key].includes(val))return false;DB.categories[key].push(val);syncConfig('categories',DB.categories);notifyChange('categories');return true;}
  function editCat(key,oldVal,newVal){const arr=DB.categories?.[key];if(!arr||arr.includes(newVal))return false;const i=arr.indexOf(oldVal);if(i<0)return false;arr[i]=newVal;syncConfig('categories',DB.categories);notifyChange('categories');return true;}
  function delCat(key,val){if(!DB.categories?.[key])return false;DB.categories[key]=DB.categories[key].filter(c=>c!==val);syncConfig('categories',DB.categories);notifyChange('categories');return true;}
  function usageCount(coll,field,val){return (DB[coll]||[]).filter(r=>r[field]===val).length;}
  function getQuickActions(filter){let list=[...(DB.quickActions||[])];if(filter){if(filter.audience)list=list.filter(q=>q.audience===filter.audience||q.audience==='Both');if(filter.enabled!==undefined)list=list.filter(q=>q.enabled===filter.enabled);}return list.sort((a,b)=>(+a.order||0)-(+b.order||0));}
  function getRate(cat){return +(DB.paidMealRates?.[cat]||0);}
  function getRates(){return DB.paidMealRates||{};}
  function setRate(cat,rate){if(!DB.paidMealRates)DB.paidMealRates={};DB.paidMealRates[cat]=+rate||0;syncConfig('paidMealRates',DB.paidMealRates);notifyChange('paidMealRates');}
  function renameRate(oldCat,newCat){if(!DB.paidMealRates||!(oldCat in DB.paidMealRates)||newCat in DB.paidMealRates)return false;DB.paidMealRates[newCat]=DB.paidMealRates[oldCat];delete DB.paidMealRates[oldCat];syncConfig('paidMealRates',DB.paidMealRates);notifyChange('paidMealRates');return true;}
  function deleteRate(cat){if(!DB.paidMealRates)return false;delete DB.paidMealRates[cat];syncConfig('paidMealRates',DB.paidMealRates);notifyChange('paidMealRates');return true;}
  function getPopups(filter){let list=[...(DB.popupMessages||[])];if(filter){if(filter.enabled!==undefined)list=list.filter(p=>p.enabled===filter.enabled);if(filter.audience)list=list.filter(p=>p.audience===filter.audience||p.audience==='All');}return list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));}
  function getActivePopups(){return getPopups({enabled:'Yes'}).filter(p=>(p.start||'0000-00-00')<=TODAY&&(p.end||'9999-99-99')>=TODAY);}
  function wasPopupShown(id){try{return JSON.parse(localStorage.getItem('ipakPopupsShown')||'[]').includes(id);}catch(e){return false;}}
  function markPopupShown(id){try{const shown=JSON.parse(localStorage.getItem('ipakPopupsShown')||'[]');if(!shown.includes(id)){shown.push(id);localStorage.setItem('ipakPopupsShown',JSON.stringify(shown.slice(-100)));}}catch(e){}}
  function clearPopupShown(){try{localStorage.removeItem('ipakPopupsShown');}catch(e){}}
  function syncSingleton(key,value){return syncConfig(key,value);}
  function reset(){const fresh=seed();DB=fresh;normalize();saveLocal();if(fbReady)replaceAll(fresh).catch(e=>console.warn('Reset failed',e));notifyChange('*');}
  function isReady(){return fbReady;}
  function hasInitialSync(){return initialSyncDone;}
  function waitForInitialSync(timeoutMs=8000){if(initialSyncDone)return Promise.resolve(true);return new Promise(resolve=>{const timer=setTimeout(()=>resolve(false),timeoutMs);window.addEventListener('ipak-initial-sync-done',()=>{clearTimeout(timer);resolve(true);},{once:true});});}
  async function forceRefresh(){if(!fbReady)return false;try{await loadAllRemote();notifyChange('*');return true;}catch(e){console.warn('Force refresh failed',e);return false;}}
  async function flushPendingWrites(){return true;}

  bootLocal();
  bootFirebase().then(ok=>{if(ok)console.log('IPAK Mess Firestore sync active');setTimeout(()=>{try{if(window.IP){if(currentUser)App.go(App.page||'dashboard');else publicPage();}}catch(e){}},150);});
  window.addEventListener('firebase-connection',e=>{fbConnected=!!(e.detail&&e.detail.connected);});

  return {all,get,insert,update:update_,remove:remove_,removeMany:removeMany_,reset,replaceAll,raw,save:saveLocal,getCats,addCat,editCat,delCat,usageCount,getQuickActions,getRate,getRates,setRate,renameRate,deleteRate,getPopups,getActivePopups,wasPopupShown,markPopupShown,clearPopupShown,syncSingleton,isFirebaseReady:isReady,hasInitialSync,waitForInitialSync,forceRefresh,flushPendingWrites};
})();

function userHasPerm(p){

  if(currentUser.role==='superadmin' || currentUser.role==='admin') return true;
  if(!Array.isArray(currentUser.permissions)) return false;

const can  = p => userHasPerm(p);
function canW(p){

async function hashPw(pw){
  if(!(window.crypto && crypto.subtle)) return pw;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ipak::'+pw));
  return 'h$'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const isHashed = v => typeof v==='string' && v.startsWith('h$');

const LOCK = { max:5, secs:30, key:'ipakLock_v10' };
const SESSION = { key:'ipakSess_v10', idleMin:20 };
let idleTimer = null;

const Auth = {
  lockLeft(){
    try{
      const l = JSON.parse(localStorage.getItem(LOCK.key)||'{}');
      return l.until && l.until>Date.now() ? Math.ceil((l.until-Date.now())/1000) : 0;
    }catch(e){ return 0; }
  },
  _fail(){
    let l={n:0};
    try{ l = JSON.parse(localStorage.getItem(LOCK.key)||'{"n":0}'); }catch(e){}
    l.n = (l.n||0)+1;
    if(l.n>=LOCK.max){ l.until = Date.now()+LOCK.secs*1000; l.n = 0; }
    try{ localStorage.setItem(LOCK.key, JSON.stringify(l)); }catch(e){}
  },
  async login(username, password){
    const wait = this.lockLeft();
    if(wait) throw new Error(`Too many attempts. Try again in ${wait}s.`);

    // ⬇ KEY FIX: wait for Firebase initial sync before checking users
    if(DataService.isFirebaseReady()){
      await DataService.waitForInitialSync(4000);
      // Also force a fresh pull right now, so we get latest users from other devices
      try{
        if(DataService.isFirebaseReady()) await DataService.forceRefresh();
      }catch(e){ console.warn('Fresh user pull on login failed', e); }
    }

    const cleanUsername = String(username || '').trim().toLowerCase();
    let u = DataService.all('users').find(x =>
      String(x.username || '').toLowerCase()===cleanUsername && x.active==='Yes');
    let ok = false;

    if(!u){
      const builtIn = seed().users.find(x =>
        String(x.username || '').toLowerCase()===cleanUsername && x.active==='Yes');
      if(builtIn && password === builtIn.password){
        u = builtIn;
        ok = true;
        try{
          if(DataService.isFirebaseReady()) DataService.insert('users', builtIn);
        }catch(e){ console.warn('Default user sync failed', e); }
        DataService.raw().users = DataService.raw().users || [];
        if(!DataService.raw().users.some(x => x.id === builtIn.id)){
          DataService.raw().users.push(builtIn);
          DataService.save();
        }
      }
    }

    if(u && !ok){
      if(isHashed(u.password)) ok = (u.password === await hashPw(password));
      else if(u.password===password){
        ok = true;
        const h = await hashPw(password);
        if(isHashed(h)) DataService.update('users', u.id, {password:h});
      }
    }
    if(!ok){ this._fail(); throw new Error('Invalid username or password'); }
    try{ localStorage.removeItem(LOCK.key); }catch(e){}
    currentUser = u;
    try{ sessionStorage.setItem(SESSION.key, u.id); }catch(e){}
    App.audit('Login', 'Auth');
    this.startIdle();
    return u;
  },
  restore(){
    try{
      const id = sessionStorage.getItem(SESSION.key);
      const u = id && DataService.get('users', id);
      if(u && u.active==='Yes'){ currentUser = u; this.startIdle(); return u; }
    }catch(e){}
    return null;
  },
  // Refresh the current user from data store (in case permissions/role changed on another device)
  refresh(){
    if(!currentUser) return;
    const fresh = DataService.get('users', currentUser.id);
    if(!fresh) return;
    if(fresh.active !== 'Yes'){
      // User was deactivated — log them out
      toast('Your account was deactivated','err',4000);
      Auth.logout(); showPublic();
      return;
    }
    currentUser = fresh;
  },
  startIdle(){
    const reset = () => {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(()=>{
        if(!currentUser) return;
        Auth.logout(); showPublic(); toast('Signed out due to inactivity','wa',4000);
      }, SESSION.idleMin*60*1000);
    };
    if(!this._idleBound){
      ['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, ()=>{ if(currentUser) reset(); }, {passive:true}));
      this._idleBound = true;
    }
    reset();
  },
  logout(){
    if(currentUser) App.audit('Logout','Auth');
    currentUser = null;
    clearTimeout(idleTimer);
    try{ sessionStorage.removeItem(SESSION.key); }catch(e){}
    App.close();
  },
  user(){ return currentUser; }
};

const V = {
  req(v){ return v!==undefined && v!==null && String(v).trim()!==''; },
  num(v,{min=0,max=Infinity}={}){ const n=Number(v); return Number.isFinite(n) && n>=min && n<=max; },
  date(v){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')) return false; const d=new Date(v+'T00:00:00'); return !isNaN(d); },
  futureDate(v){ return this.date(v) && v > TODAY; },
};

      if(current === el) $('#popupRoot').innerHTML='';
    }, 200);
  }
}

let tableState = {coll:null, filters:{}, sort:null, page:1, perPage:25, selected:{}};

function getSelected(coll){
  if(!tableState.selected[coll]) tableState.selected[coll] = new Set();
  return tableState.selected[coll];
}
function clearSelection(coll){ tableState.selected[coll] = new Set(); }

function renderTable(coll){
  const cfg = TABLES[coll];
  if(!cfg) return toast('Unknown table','err');
  tableState.coll = coll;
  if(!tableState.sort) tableState.sort = cfg.sort || 'date-desc';
  if(!tableState.filters[coll]) tableState.filters[coll] = {};

  let rows;
  if(coll === 'audit'){
    rows = Object.values(DataService.raw().audit || {});
    rows.sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
  } else {
    rows = [...DataService.all(coll)];
  }
  const f = tableState.filters[coll];

  if(coll==='menu'){
    if(!f._month) f._month = monthOf(TODAY);
    rows = rows.filter(r => (r.month||r.date.slice(0,7))===f._month);
  }

  Object.entries(f).forEach(([k,v])=>{
    if(!v) return;
    if(k==='_dateFrom') rows = rows.filter(r=>r.date>=v);
    else if(k==='_dateTo') rows = rows.filter(r=>r.date<=v);
    else if(k==='_month') {}
    else if(k==='_q'){
      const q = v.toLowerCase();
      rows = rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
    } else rows = rows.filter(r=>String(r[k]).toLowerCase().includes(v.toLowerCase()));
  });

  if(coll !== 'audit'){
    const [sf, sd] = tableState.sort.split('-');
    rows.sort((a,b)=>{
      let av=a[sf], bv=b[sf];
      if(av===undefined) av=''; if(bv===undefined) bv='';
      if(!isNaN(+av) && !isNaN(+bv) && av!=='' && bv!==''){ av=+av; bv=+bv; }
      if(av<bv) return sd==='asc'?-1:1;
      if(av>bv) return sd==='asc'?1:-1;
      return 0;
    });
  }

  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total/tableState.perPage));
  tableState.page = Math.min(tableState.page, pages);
  const start = (tableState.page-1)*tableState.perPage;
  const pageRows = rows.slice(start, start+tableState.perPage);

  const writable = canW(coll==='reports'?'operations':coll);
  const readonly = cfg.readonly || !writable;
  const selectable = cfg.selectable && !readonly;
  const selectedSet = getSelected(coll);

  if(selectable){
    const validIds = new Set(rows.map(r=>r.id));
    [...selectedSet].forEach(id=>{ if(!validIds.has(id)) selectedSet.delete(id); });
  }

  const addLabel = coll==='menu' ? '＋ Add Menu' : `＋ Add ${cfg.title.replace(/s$/,'')}`;
  const filterHtml = `
    <div class="filters">
      <div><label>Search</label><input placeholder="Search…" value="${esc(f._q||'')}" oninput="IP.f('${coll}','_q',this.value)"></div>
      ${['reports','complaints','feedback','waste','audit'].includes(coll)?`
        <div><label>From</label><input type="date" value="${esc(f._dateFrom||'')}" onchange="IP.f('${coll}','_dateFrom',this.value)"></div>
        <div><label>To</label><input type="date" value="${esc(f._dateTo||'')}" onchange="IP.f('${coll}','_dateTo',this.value)"></div>`:''}
      ${coll==='complaints'?`<div><label>Status</label><select onchange="IP.f('${coll}','status',this.value)"><option value="">All</option>${COMPLAINT_STATUS.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
      ${coll==='popupMessages'?`<div><label>Enabled</label><select onchange="IP.f('${coll}','enabled',this.value)"><option value="">All</option><option ${f.enabled==='Yes'?'selected':''}>Yes</option><option ${f.enabled==='No'?'selected':''}>No</option></select></div>`:''}
      ${coll==='menu'?`<div><label>Month</label><input type="month" value="${esc(f._month||monthOf(TODAY))}" onchange="IP.f('${coll}','_month',this.value)"></div>`:''}
      ${coll==='waste'?`<div><label>Meal</label><select onchange="IP.f('${coll}','meal',this.value)"><option value="">All</option>${DataService.getCats('meal').map(m=>`<option ${f.meal===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>`:''}
      <button class="btn s sm" onclick="IP.clearF('${coll}')">Clear</button>
    </div>`;

  const primaryActions = `
    <div class="popup-actions-row">
      ${!readonly?`<button class="btn" onclick="IP.addRow('${coll}')">${esc(addLabel)}</button>`:''}
      ${coll==='popupMessages'?`<button class="btn a" onclick="IP.popupAdd()">＋ New Popup Message</button>

function savePopup(e, id){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const errs = [];
  if(!V.req(data.title)) errs.push('Title is required');
  if(!V.req(data.body)) errs.push('Message body is required');
  if(!V.date(data.start)) errs.push('Valid start date required');
  if(!V.date(data.end)) errs.push('Valid end date required');
  if(V.date(data.start) && V.date(data.end) && data.end < data.start) errs.push('End date must be after start date');
  if(errs.length){ errs.forEach(m=>toast(m,'err',3200)); return false; }

  data.updatedAt = nowISO();
  if(id){
    DataService.update('popupMessages', id, data);
    App.audit('Update Popup','popups', data.title);
  } else {
    data.createdAt = nowISO();
    data.createdBy = currentUser ? currentUser.username : 'system';
    DataService.insert('popupMessages', data);
    App.audit('Create Popup','popups', data.title);
  }
  App.close();
  toast('Popup message saved','ok');
  if(App.page==='popups') renderTable('popupMessages');
  return false;

async function saveUser(e, id){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));
  const errs = [];
  if(!V.req(data.username)) errs.push('Username is required');
  if(!id && !V.req(data.password)) errs.push('Password is required');
  if(V.req(data.password) && String(data.password).length<6) errs.push('Password must be at least 6 characters');
  if(!V.req(data.name)) errs.push('Full Name is required');
  if(!V.req(data.role)) errs.push('Role is required');

  const dup = DataService.all('users').find(u=>u.username.toLowerCase()===String(data.username).toLowerCase() && u.id!==id);
  if(dup) errs.push('Username already exists');

  const isAdminRole = (data.role==='superadmin' || data.role==='admin');
  let permissions;
  if(isAdminRole) permissions = PERMISSIONS.map(p=>p.key);
  else {
    permissions = [];
    PERMISSIONS.forEach(p=>{
      const cb = form.querySelector(`input[name="perm_${p.key}"]`);
      if(cb && cb.checked) permissions.push(p.key);
    });
    if(!permissions.length) errs.push('Select at least one function for this user');
  }
  if(errs.length){ errs.forEach(m=>toast(m,'err',3200)); return false; }

  data.permissions = permissions;
  data.updatedAt = nowISO();
  if(V.req(data.password)) data.password = await hashPw(String(data.password));
  else delete data.password;

  if(id){ DataService.update('users', id, data); App.audit('Update User', 'users', data.username); }
  else { data.createdAt = nowISO(); DataService.insert('users', data); App.audit('Create User', 'users', data.username); }

  App.close(); toast('User saved','ok'); renderTable('users');
  return false;
}

function addPMRow(cat, qty, rate){
  const rateCats = window.__pmRateCats || [];
  const rates = window.__pmRates || {};
  const container = document.getElementById('pmRows');
  if(!container) return;
  const row = document.createElement('div');
  row.className = 'pm-row';
  row.innerHTML = `
    <div class="pm-cat">
      <label>Category</label>
      <select name="pm_cat" onchange="IP.pmCatChange(this)">
        ${rateCats.map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
    </div>
    <div><label>Quantity</label><input name="pm_qty" type="number" min="0" step="1" value="${qty??0}" oninput="IP.recalcPMTotals()"></div>
    <div><label>Rate (PKR)</label><input name="pm_rate" type="number" min="0" step="any" value="${rate??(rates[cat]||0)}" oninput="IP.recalcPMTotals()"></div>
    <button type="button" class="rm" title="Remove" onclick="this.closest('.pm-row').remove();IP.recalcPMTotals()">✕</button>
  `;
  container.appendChild(row);
}
function pmCatChange(sel){
  const rate = (window.__pmRates||{})[sel.value] || 0;
  const row = sel.closest('.pm-row');
  const rateInput = row.querySelector('[name="pm_rate"]');
  if(rateInput) rateInput.value = rate;
  recalcPMTotals();
}
function recalcPMTotals(){
  const rows = document.querySelectorAll('#pmRows .pm-row');
  let qty = 0, rev = 0;
  rows.forEach(row=>{
    const q = +row.querySelector('[name="pm_qty"]').value || 0;
    const r = +row.querySelector('[name="pm_rate"]').value || 0;
    qty += q; rev += q * r;
  });
  const tq = document.getElementById('pmTotalQty');
  const tr = document.getElementById('pmTotalRev');
  if(tq) tq.textContent = N(qty);
  if(tr) tr.textContent = money(rev);
}
function saveReport(e, id){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));

  const pmRows = form.querySelectorAll('#pmRows .pm-row');
  const paidMealsByCat = [];
  pmRows.forEach(row=>{
    const cat = row.querySelector('[name="pm_cat"]').value;
    const qty = +row.querySelector('[name="pm_qty"]').value || 0;
    const rate = +row.querySelector('[name="pm_rate"]').value || 0;
    if(qty > 0) paidMealsByCat.push({ category: cat, qty, rate });
  });
  const paidMeals = paidMealsByCat.reduce((s,x)=>s+x.qty,0);
  const revenue = paidMealsByCat.reduce((s,x)=>s+x.qty*x.rate,0);
  ['emp','guest','contr','prepared','waste','madrasa','water'].forEach(k=>data[k]=+data[k]||0);

  const errs = [];
  if(V.futureDate(data.date)) errs.push('Date cannot be in the future');
  if(data.waste > data.prepared) errs.push('Waste cannot exceed food prepared');
  const dup = DataService.all('reports').find(r=>r.date===data.date && r.id!==id);
  if(dup) errs.push('A report for this date already exists');
  if(errs.length){ errs.forEach(m=>toast(m,'err',3200)); return false; }

  data.day = dayName(data.date);
  data.paidMealsByCat = paidMealsByCat;
  data.paidMeals = paidMeals;
  data.revenue = revenue;
  data.updatedAt = nowISO();
  data.updatedBy = currentUser ? currentUser.username : 'public';

  if(id){ DataService.update('reports', id, data); App.audit('Update', 'reports', id); }
  else {
    data.createdAt = nowISO();
    data.createdBy = currentUser ? currentUser.username : 'public';
    const rec = DataService.insert('reports', data);
    App.audit('Create', 'reports', rec.id);
  }
  App.close(); toast('Report saved','ok'); renderTable('reports');
  return false;
}

function saveForm(e, coll, id){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const F = FORMS[coll];
  const errs = [];
  F.fields.forEach(f=>{
    const v = data[f.k];
    if(f.req && !V.req(v)) errs.push(`${f.l} is required`);
    if(f.t==='number' && V.req(v)){
      const n = Number(v);
      if(!Number.isFinite(n)) errs.push(`${f.l} must be a number`);
      else{
        if(f.min!==undefined && n<f.min) errs.push(`${f.l} must be ≥ ${f.min}`);
        if(f.max!==undefined && n>f.max) errs.push(`${f.l} must be ≤ ${f.max}`);
        data[f.k] = n;
      }
    }
  });
  if(coll==='waste'){ if(data.waste > data.prepared) errs.push('Waste cannot exceed prepared qty'); }
  if(coll==='menu'){
    data.month = (data.date||'').slice(0,7);
    const dup = DataService.all('menu').find(m => m.date===data.date && m.meal===data.meal && m.id!==id);
    if(dup) errs.push('Menu for this date + meal already exists');
  }
  if(coll==='announcements'){ if(data.end < data.start) errs.push('End date must be after start date'); }
  if(errs.length){ errs.forEach(m=>toast(m,'err',3200)); return false; }

  data.updatedAt = nowISO();
  data.updatedBy = currentUser ? currentUser.username : 'public';

  if(id){ DataService.update(coll, id, data); App.audit('Update', coll, id); }
  else {
    data.createdAt = nowISO();
    data.createdBy = currentUser ? currentUser.username : 'public';
    if(coll==='complaints') data.ref = 'CMP-'+new Date().getFullYear()+'-'+String(DataService.all('complaints').length+1).padStart(4,'0');
    const rec = DataService.insert(coll, data);
    App.audit('Create', coll, rec.id||data.ref||'');
  }
  App.close(); toast('Saved successfully','ok'); renderTable(coll);
  return false;
}

function deleteRow(coll, id){
  if(!confirm('Delete this record? This action will be logged.')) return;
  DataService.remove(coll, id);
  App.audit('Delete', coll, id);
  toast('Deleted','ok');
  renderTable(coll);
}
function togglePublish(id){
  const r = DataService.get('menu', id);
  if(!r) return;
  DataService.update('menu', id, {published: r.published==='Yes'?'No':'Yes'});
  App.audit('Toggle Publish','menu', id);

}

function saveSimpleMenu(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  if(!V.date(d.date)) return toast('Invalid date','err'), false;
  const existing = DataService.all('menu').find(m=>m.date===d.date && m.meal===d.meal);

}

    y1:{position:'right',grid:{drawOnChartArea:false},beginAtZero:true}
  }}});

  chart('ch2',{type:'bar',data:{labels,datasets:[
    {label:'Waste (KG)',    data:last14.map(r=>+r.waste||0),    backgroundColor:'#ef4444'},
    {label:'Prepared (KG)', data:last14.map(r=>+r.prepared||0), backgroundColor:'#177e93'},

  ]},options:{scales:{
    y:{beginAtZero:true,position:'left'},
    y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'},suggestedMax:Math.max(wasteTarget*2,20)}
  }}});

  const statusCounts = COMPLAINT_STATUS.map(s=>({s,n:complaints.filter(c=>c.status===s).length}));
  const statusNonZero = statusCounts.filter(x=>x.n>0);
  if(statusNonZero.length){
    chart('chComplaint',{type:'doughnut',data:{
      labels: statusNonZero.map(x=>x.s),
      datasets:[{data:statusNonZero.map(x=>x.n),backgroundColor:['#64748b','#f59e0b','#177e93','#10b981','#0f4c5c'].slice(0,statusNonZero.length)}]
    }});
  } else {
    const el = document.getElementById('chComplaint');
    if(el) el.parentElement.innerHTML = '<div class="empty"><i>💬</i><p>No complaints submitted</p></div>';
  }

  const fbFields = [
    {k:'quality',l:'Quality'},{k:'taste',l:'Taste'},{k:'quantity',l:'Quantity'},
    {k:'temperature',l:'Temp'},{k:'service',l:'Service'},{k:'cleanliness',l:'Clean'},
    {k:'overall',l:'Overall'}
  ];
  if(fb.length){
    chart('chFeedback',{type:'bar',data:{
      labels:fbFields.map(f=>f.l),
      datasets:[{label:'Avg',data:fbFields.map(f=>+avgField(f.k).toFixed(2)),backgroundColor:'#177e93'}]
    },options:{scales:{y:{beginAtZero:true,max:5,ticks:{stepSize:1}}}}});
  } else {
    const el = document.getElementById('chFeedback');
    if(el) el.parentElement.innerHTML = '<div class="empty"><i>⭐</i><p>No feedback submitted</p></div>';
  }

  const catAgg = {};
  monthReports.forEach(r=>{(r.paidMealsByCat||[]).forEach(x=>{
    const c = x.category || 'Other';
    catAgg[c] = (catAgg[c]||0) + (+x.qty||0);
  })});
  const catEntries = Object.entries(catAgg).filter(([,q])=>q>0).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length){
    const palette = ['#177e93','#e67e22','#10b981','#f59e0b','#ef4444','#0f4c5c','#64748b','#8b5cf6'];
    chart('chCat',{type:'doughnut',data:{
      labels:catEntries.map(([c])=>c),
      datasets:[{data:catEntries.map(([,q])=>q),backgroundColor:catEntries.map((_,i)=>palette[i%palette.length])}]
    }});
  } else {
    const el = document.getElementById('chCat');
    if(el) el.parentElement.innerHTML = '<div class="empty"><i>💰</i><p>No paid meals recorded this month</p></div>';
  }
};

function buildRecentSubmissions(reports, wasteRecs, complaints, feedbackRecs){
  const feed = [];
  [...reports].sort((a,b)=>(b.updatedAt||b.createdAt||b.date||'').localeCompare(a.updatedAt||a.createdAt||a.date||'')).slice(0,5).forEach(r=>{
    feed.push({
      ts: r.updatedAt||r.createdAt||r.date,
      icon:'📝', title:`Daily Report · ${r.date}`,
      meta:[`${N(totalMeals(r))} meals`, `${r.waste||0} KG waste`, `Paid ${N(reportPaidMeals(r))}`, money(reportRevenue(r))],
      tag:'reports'
    });
  });
  [...wasteRecs].sort((a,b)=>(b.updatedAt||b.createdAt||b.date||'').localeCompare(a.updatedAt||a.createdAt||a.date||'')).slice(0,5).forEach(w=>{
    feed.push({
      ts: w.updatedAt||w.createdAt||w.date,
      icon:'🗑️', title:`Waste · ${w.item||'Item'}`,
      meta:[w.date, w.meal, `${w.waste} ${w.unit||''}`, w.reason||''],
      tag:'waste'
    });
  });
  [...complaints].sort((a,b)=>(b.updatedAt||b.createdAt||b.date||'').localeCompare(a.updatedAt||a.createdAt||a.date||'')).slice(0,5).forEach(c=>{
    feed.push({
      ts: c.updatedAt||c.createdAt||c.date,
      icon:'💬', title:`Complaint · ${c.subject||c.ref}`,
      meta:[c.date, c.category, c.priority, c.status],
      tag:'complaints'
    });
  });
  [...feedbackRecs].sort((a,b)=>(b.updatedAt||b.createdAt||b.date||'').localeCompare(a.updatedAt||a.createdAt||a.date||'')).slice(0,5).forEach(f=>{
    feed.push({
      ts: f.updatedAt||f.createdAt||f.date,
      icon:'⭐', title:`Feedback · ${f.name||f.empId||'Anonymous'}`,
      meta:[f.date, `Overall ${f.overall||'—'}★`, f.quality?`Q${f.quality}`:'', f.comments?f.comments.slice(0,30):''],
      tag:'feedback'
    });
  });
  feed.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  if(!feed.length){
    return '<div class="empty" style="padding:20px"><i>📭</i><p style="font-size:12px">No submissions yet</p></div>';
  }
  return feed.slice(0,15).map(x=>`
    <div class="recent-item">
      <span class="ri-icon">${x.icon}</span>
      <div class="ri-body">
        <div class="ri-title">${esc(x.title)}</div>
        <div class="ri-meta">
          <span class="tag ri-tag">${esc(x.tag)}</span>
          ${x.meta.filter(m=>m).map(m=>`<span>${esc(String(m))}</span>`).join('')}
        </div>
      </div>
    </div>`).join('');
}

function buildCategoryTable(monthReports){
  const catAgg = {};
  monthReports.forEach(r=>{(r.paidMealsByCat||[]).forEach(x=>{
    const c = x.category || 'Other';
    if(!catAgg[c]) catAgg[c] = {qty:0, rev:0};
    catAgg[c].qty += +x.qty||0;
    catAgg[c].rev += (+x.qty||0)*(+x.rate||0);
  })});
  const rows = Object.entries(catAgg).map(([c,v])=>({c, ...v})).sort((a,b)=>b.rev-a.rev);
  if(!rows.length) return '<div class="empty" style="padding:20px"><p style="font-size:12px">No paid meals this month</p></div>';
  const totalRev = rows.reduce((s,x)=>s+x.rev,0) || 1;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Category</th><th>Qty</th><th>Revenue</th><th>Share</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><b>${esc(r.c)}</b></td>
      <td>${N(r.qty)}</td>
      <td><span class="tag money">${money(r.rev)}</span></td>
      <td>${(r.rev/totalRev*100).toFixed(0)}%</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

PG.analytics = function(){
  const reports = DataService.all('reports');
  const complaints = DataService.all('complaints');
  const feedback = DataService.all('feedback');
  const wasteRecs = DataService.all('waste');
  $('#pg').innerHTML = `
    <div class="grid">
      <div class="card"><h3><span class="h3l">Meals · last 30 days</span></h3><div class="ch"><canvas id="a1"></canvas></div></div>

      <div class="card"><h3><span class="h3l">Complaint status</span></h3><div class="ch sm"><canvas id="a3"></canvas></div></div>
      <div class="card"><h3><span class="h3l">Feedback averages</span></h3><div class="ch sm"><canvas id="a4"></canvas></div></div>
      <div class="card"><h3><span class="h3l">Waste by meal (all time)</span></h3><div class="ch sm"><canvas id="a6"></canvas></div></div>
    </div>`;
  const chart = (id,cfg)=>{ const el=document.getElementById(id); if(el) App.charts[id]=new Chart(el,Object.assign({options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}},cfg)); };
  const last30 = [...reports].sort((a,b)=>a.date<b.date?1:-1).slice(0,30).reverse();
  chart('a1',{type:'line',data:{labels:last30.map(r=>r.date.slice(5)),datasets:[{label:'Total Meals',data:last30.map(r=>totalMeals(r)),borderColor:'#177e93',tension:.3,fill:true,backgroundColor:'#177e9322'}]}});
  chart('a5',{type:'bar',data:{labels:last30.map(r=>r.date.slice(5)),datasets:[{label:'Revenue',data:last30.map(r=>reportRevenue(r)),backgroundColor:'#10b981'}]}});
  chart('a2',{type:'bar',data:{labels:last30.map(r=>r.date.slice(5)),datasets:[
    {label:'Prepared (KG)',data:last30.map(r=>+r.prepared||0),backgroundColor:'#177e93'},
    {label:'Waste (KG)',data:last30.map(r=>+r.waste||0),backgroundColor:'#ef4444'}
  ]}});
  const cStatus = COMPLAINT_STATUS.map(s=>({s,n:complaints.filter(c=>c.status===s).length})).filter(x=>x.n>0);
  if(cStatus.length) chart('a3',{type:'doughnut',data:{labels:cStatus.map(x=>x.s),datasets:[{data:cStatus.map(x=>x.n),backgroundColor:['#64748b','#f59e0b','#177e93','#10b981','#0f4c5c'].slice(0,cStatus.length)}]}});
  else { const el=document.getElementById('a3'); if(el) el.parentElement.innerHTML = '<div class="empty"><i>💬</i><p>No complaints</p></div>'; }
  const avg = k => feedback.length ? (feedback.reduce((s,f)=>s+(+f[k]||0),0)/feedback.length).toFixed(2) : 0;
  if(feedback.length) chart('a4',{type:'bar',data:{labels:['Quality','Taste','Quantity','Temp','Service','Clean','Overall'],datasets:[{label:'Avg',data:[avg('quality'),avg('taste'),avg('quantity'),avg('temperature'),avg('service'),avg('cleanliness'),avg('overall')],backgroundColor:'#177e93'}]},options:{scales:{y:{max:5,min:0,ticks:{stepSize:1}}}}});
  else { const el=document.getElementById('a4'); if(el) el.parentElement.innerHTML = '<div class="empty"><i>⭐</i><p>No feedback</p></div>'; }
  const wasteByMeal = {};
  wasteRecs.forEach(w=>{ const m = w.meal||'Unknown'; wasteByMeal[m] = (wasteByMeal[m]||0)+(+w.waste||0); });
  const wmEntries = Object.entries(wasteByMeal).sort((a,b)=>b[1]-a[1]);
  if(wmEntries.length) chart('a6',{type:'bar',data:{labels:wmEntries.map(x=>x[0]),datasets:[{label:'Waste (KG)',data:wmEntries.map(x=>x[1]),backgroundColor:'#e67e22'}]}});
  else { const el=document.getElementById('a6'); if(el) el.parentElement.innerHTML = '<div class="empty"><i>🗑️</i><p>No waste records</p></div>'; }
};

function exportExcel(coll){
  const cfg = TABLES[coll];
  const rows = DataService.all(coll).map(r=>{
    const o = {};
    (cfg?cfg.cols:Object.keys(r)).forEach(c=>{
      if(coll==='reports' && c==='revenue') o['Revenue'] = reportRevenue(r);
      else if(coll==='reports' && c==='paidMeals') o['Paid Meals'] = reportPaidMeals(r);
      else o[(cfg&&cfg.labels[c])||c] = r[c] ?? '';
    });
    return o;
  });
  if(!rows.length) return toast('No data to export','wa');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), (cfg?cfg.title:coll).slice(0,30));
  XLSX.writeFile(wb, coll+'-'+TODAY+'.xlsx');
  App.audit('Export', coll, rows.length+' rows');
  toast('Exported','ok');
}

  toggleAll: (coll, checked) => {

    const f = tableState.filters[coll]||{};

    if(coll==='menu'){
      const m = f._month || monthOf(TODAY);
      rows = rows.filter(r => (r.month||r.date.slice(0,7))===m);
    }
    Object.entries(f).forEach(([k,v])=>{
      if(!v) return;
      if(k==='_dateFrom') rows = rows.filter(r=>r.date>=v);
      else if(k==='_dateTo') rows = rows.filter(r=>r.date<=v);
      else if(k==='_month') {}
      else if(k==='_q'){
        const q = v.toLowerCase();
        rows = rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
      } else rows = rows.filter(r=>String(r[k]).toLowerCase().includes(v.toLowerCase()));
    });

    const pageRows = rows.slice(start, start+tableState.perPage);

    const newCat = d.cat.trim();
    const newRate = +d.rate || 0;
    if(!newCat) return toast('Name required','err'), false;

    if(oldCat){
      if(newCat !== oldCat){
        if(!DataService.renameRate(oldCat, newCat)) return toast('A category with this name already exists','err'), false;
        DataService.editCat('paidMealCat', oldCat, newCat);
        DataService.all('reports').forEach(r=>{
          if(Array.isArray(r.paidMealsByCat)){
            let changed = false;
            r.paidMealsByCat.forEach(x=>{ if(x.category===oldCat){ x.category = newCat; changed = true; } });
            if(changed){
              const qty = r.paidMealsByCat.reduce((s,x)=>s+(+x.qty||0),0);
              const rev = r.paidMealsByCat.reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0);
              DataService.update('reports', r.id, {paidMealsByCat: r.paidMealsByCat, paidMeals: qty, revenue: rev});
            }
          }
        });
      }
      DataService.setRate(newCat, newRate);
      App.audit('Edit Rate', 'rates', newCat+' → '+newRate);
      toast('Rate updated','ok');
    } else {
      if(DataService.getCats('paidMealCat').includes(newCat)) return toast('Already exists','err'), false;
      DataService.addCat('paidMealCat', newCat);
      DataService.setRate(newCat, newRate);
      App.audit('Add Rate', 'rates', newCat+' → '+newRate);
      toast('Rate added','ok');

    App.close(); PG.rates();
    return false;

  saveQuickMeal: (e, meal) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    ['emp','guest','contr','prepared','waste','paidQty'].forEach(k=>d[k]=+d[k]||0);
    d.meal = meal || 'General';
    if(V.futureDate(d.date)) return toast('Date cannot be future','err'), false;
    const paidMealsByCat = d.paidCat && d.paidQty>0 ? [{ category: d.paidCat, qty: d.paidQty, rate: +d.paidRate||0 }] : [];
    const paidMeals = paidMealsByCat.reduce((s,x)=>s+x.qty,0);
    const revenue = paidMealsByCat.reduce((s,x)=>s+x.qty*x.rate,0);

    const existing = DataService.all('reports').find(r=>r.date===d.date);
    if(existing){
      const merged = [...(existing.paidMealsByCat||[]), ...paidMealsByCat];
      const totalPaid = merged.reduce((s,x)=>s+(+x.qty||0),0);
      const totalRev = merged.reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0);
      DataService.update('reports', existing.id, {
        emp: (+existing.emp||0)+(+d.emp||0), guest: (+existing.guest||0)+(+d.guest||0),
        contr: (+existing.contr||0)+(+d.contr||0), prepared: (+existing.prepared||0)+(+d.prepared||0),
        waste: (+existing.waste||0)+(+d.waste||0), paidMealsByCat: merged, paidMeals: totalPaid, revenue: totalRev,
        notes: (existing.notes||'')+` | ${d.meal} added`,
      });
      toast(d.meal+' added to '+d.date+' report','ok');
    } else {
      d.day = dayName(d.date); d.madrasa = 0; d.water = 0;
      d.paidMealsByCat = paidMealsByCat; d.paidMeals = paidMeals; d.revenue = revenue;
      DataService.insert('reports', d);
      toast('Report saved','ok');
    }
    App.audit('Quick Meal', 'reports', d.meal+' '+d.date);
    App.close();
    if(['dashboard','reports','daily'].includes(App.page)) App.go(App.page);
    return false;
  },

    DataService.remove('reports', id);
    App.audit('Delete Daily Meal','reports', r.date);
    toast('Deleted '+r.date,'ok');
    if(App.page==='daily') PG.daily();
    else if(App.page==='reports' || App.page==='reports_daily') renderTable('reports');
    else App.go('daily');
  },

  complaint: () => {
    App.modal(`
      <h3>💬 Submit Complaint</h3>
      <form onsubmit="return IP.subComplaint(event)">
        <div class="fg">
          <div><label class="req">Name</label><input name="name" required></div>
          <div><label class="req">Employee ID</label><input name="empId" required></div>
          <div><label>Category</label><select name="category">${DataService.getCats('complaint').map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
          <div><label>Priority</label><select name="priority">${PRIORITIES.map(p=>`<option>${p}</option>`).join('')}</select></div>
          <div class="f"><label class="req">Subject</label><input name="subject" required></div>
          <div class="f"><label>Details</label><textarea name="desc" rows="3"></textarea></div>
        </div>
        <button class="btn block" style="margin-top:12px">Submit</button>
      </form>`);
  },
  subComplaint: e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.date = TODAY; d.status = 'Submitted'; d.createdAt = nowISO(); d.createdBy = 'public';
    d.id = uid('C');
    d.ref = 'CMP-'+new Date().getFullYear()+'-'+String(DataService.all('complaints').length+1).padStart(4,'0');
    DataService.insert('complaints', d);
    App.audit('Complaint', 'public', d.ref);
    App.notify('New Complaint', d.ref+' — '+d.subject);
    App.modal(`<h3>✅ Submitted</h3><p>Reference: <b>${d.ref}</b></p><button class="btn block" onclick="IP.cm()">Close</button>`);
    return false;
  },
  trackComplaint: () => {
    App.modal(`
      <h3>🔍 Check Complaint Status</h3>
      <p style="color:var(--mu);font-size:13px">Enter your Employee ID to view your complaints.</p>
      <form onsubmit="return IP.doEmpTrack(event)">
        <label class="req">Employee ID</label>
        <input name="empId" placeholder="e.g. EMP001" required>
        <button class="btn block" style="margin-top:12px">Check Status</button>
      </form>
      <div id="empTrackResult" style="margin-top:12px"></div>`);
  },
  doEmpTrack: (e) => {
    e.preventDefault();
    const empId = new FormData(e.target).get('empId').trim();
    const complaints = DataService.all('complaints').filter(c => c.empId === empId);
    const el = document.getElementById('empTrackResult');
    if(!complaints.length){
      el.innerHTML = '<div class="alert y">No complaints found for this Employee ID.</div>';
      return false;
    }
    el.innerHTML = complaints.map(c => `
      <div class="alert" style="flex-direction:column;align-items:flex-start;gap:6px">
        <div style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;gap:6px">
          <b>${esc(c.subject)}</b>
          <span class="tag ${c.status === 'Resolved' || c.status === 'Closed' ? 'g' : c.status === 'Submitted' ? 'y' : ''}">${esc(c.status)}</span>
        </div>
        <div style="font-size:12px;color:var(--mu)">Ref: ${esc(c.ref)} · ${esc(c.date)} · ${esc(c.category)} · Priority: ${esc(c.priority)}</div>
        ${c.reply ? `<div style="margin-top:4px"><b>Response:</b> ${esc(c.reply)}</div>` : ''}
      </div>`).join('');
    return false;
  },
  feedback: () => {
    App.modal(`
      <h3>⭐ Submit Feedback</h3>
      <form onsubmit="return IP.subFeedback(event)">
        <div class="fg">
          <div><label>Employee ID</label><input name="empId"></div>
          <div><label>Name</label><input name="name"></div>
          ${['quality','taste','quantity','temperature','service','cleanliness','overall'].map(k=>`
            <div><label>${k.charAt(0).toUpperCase()+k.slice(1)} (1-5)</label>
              <select name="${k}">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ${'★'.repeat(n)}</option>`).join('')}</select>
            </div>`).join('')}
          <div class="f"><label>Comments</label><textarea name="comments" rows="3"></textarea></div>
        </div>
        <button class="btn block" style="margin-top:12px">Submit</button>
      </form>`);
  },
  subFeedback: e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    d.date = TODAY; d.createdAt = nowISO();
    ['quality','taste','quantity','temperature','service','cleanliness','overall'].forEach(k=>d[k]=+d[k]);
    DataService.insert('feedback', d);
    App.audit('Feedback','public', d.name||d.empId||'');
    App.modal('<h3>✅ Thank you!</h3><p>Feedback recorded.</p><button class="btn block" onclick="IP.cm()">Close</button>');
    return false;
  },
  timings: () => {
    App.modal(`<h3>⏰ Mess Timings</h3>
      <table><thead><tr><th>Meal</th><th>Start</th><th>End</th><th>Status</th></tr></thead>
      <tbody>${DataService.all('timings').map(t=>{
        const s = mealStatus(t);
        return `<tr><td>${esc(t.meal)}</td><td>${t.start}</td><td>${t.end}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`;
      }).join('')}</tbody></table>
      <button class="btn s" style="margin-top:12px" onclick="IP.cm()">Close</button>`);
  },
  week: () => {
    const today = new Date(); const rows = [];
    for(let i=0;i<7;i++){
      const d = new Date(today); d.setDate(d.getDate()+i);
      const ds = lt(d); const dayMenu = menuForDate(ds);
      if(dayMenu.length) rows.push({date:ds, day:DAYS[d.getDay()], items:dayMenu});
    }
    App.modal(`<h3>📅 Weekly Menu</h3>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Date</th><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.date.slice(5)}</td><td>${r.day}</td>
          ${['Breakfast','Lunch','Dinner'].map(m=>{ const it = r.items.find(x=>x.meal===m); return `<td>${it?esc(it.items):'—'}</td>`; }).join('')}
        </tr>`).join('')}</tbody></table></div>
      <button class="btn s" style="margin-top:12px" onclick="IP.cm()">Close</button>`);
  },
  monthView: () => {
    const m = monthOf(TODAY);
    const [y,mo] = m.split('-').map(Number);
    const last = new Date(y, mo, 0).getDate();
    const monthMenu = DataService.all('menu').filter(x=>(x.month||x.date.slice(0,7))===m && x.published==='Yes');
    let html = '<h3>🗓️ '+monthLabel(m)+'</h3><div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody>';
    for(let d=1; d<=last; d++){
      const ds = m+'-'+String(d).padStart(2,'0');
      const items = monthMenu.filter(x=>x.date===ds);
      if(!items.length) continue;
      html += `<tr ${ds===TODAY?'style="background:#e67e2220;font-weight:700"':''}><td>${ds.slice(5)}</td>
        ${['Breakfast','Lunch','Dinner'].map(meal=>{ const it = items.find(x=>x.meal===meal); return `<td>${it?esc(it.items):'—'}</td>`; }).join('')}</tr>`;
    }
    html += '</tbody></table></div><button class="btn s" style="margin-top:12px" onclick="IP.cm()">Close</button>';
    App.modal(html);
  },

  saveSettings: () => {
    const s = DataService.raw().settings;
    s.company = $('#s_company').value;
    s.site = $('#s_site').value;
    s.mess = $('#s_mess').value;
    s.currency = $('#s_currency').value;
    s.target = +$('#s_target').value;
    s.timezone = $('#s_tz').value;
    s.theme = $('#s_theme').value;
    s.popupsEnabled = $('#s_popups_enabled').value;
    s.popupDelay = +$('#s_popup_delay').value || 800;
    DataService.save();
    if(DataService.isFirebaseReady()){
      try{ DataService.syncSingleton('settings', s); }catch(e){}
    }
    if(s.theme!=='auto') document.documentElement.dataset.theme = s.theme;
    App.audit('Settings','update','');
    toast('Settings saved','ok');
  },
  backup: () => {
    const blob = new Blob([JSON.stringify(DataService.raw(), null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ipak-mess-backup-'+TODAY+'.json';
    a.click();
    App.audit('Backup','system','');
  },
  restore: (file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const d = JSON.parse(reader.result);
        if(!d.meta || !d.users) throw new Error('Invalid backup');
        if(!confirm('Restore will replace ALL current data. Continue?')) return;
        DataService.replaceAll(d);
        toast('Data restored','ok');
        App.audit('Restore','system','');
        if(currentUser){ adminShell(); App.go('dashboard'); }
        else publicPage();
      }catch(e){ toast('Invalid backup: '+e.message, 'err'); }
    };
    reader.readAsText(file);
  },
  markRead: () => {
    const list = DataService.all('notifications');
    list.forEach(n => { if(!n.read) DataService.update('notifications', n.id, {read:true}); });
    App.go('notifications');
  },
  clearNotifs: () => {
    const list = [...DataService.all('notifications')];
    list.forEach(n => DataService.remove('notifications', n.id));
    toast('Notifications cleared','ok');
    App.go('notifications');
  },
  resetPopupShown: () => {
    DataService.clearPopupShown();
    toast('Popup "shown once" memory cleared','ok');
    App.audit('Reset Popup Memory','popups','');
  },
  closePopup,

  fbPush: async () => {
    if(!DataService.isFirebaseReady()) return toast('Firebase not connected','err');
    if(!confirm('Overwrite Firebase with local data?')) return;
    try{
      await DataService.replaceAll(DataService.raw());
      await DataService.flushPendingWrites();
      toast('Local data queued and pushed to Firebase','ok');
      App.audit('FB Push','system','');
    }catch(e){ toast('Push failed: '+e.message,'err'); }
  },
  fbPull: async () => {
    if(!DataService.isFirebaseReady()) return toast('Firebase not connected','err');
    if(!confirm('Overwrite local data with Firebase data?')) return;
    try{
      const ok = await DataService.forceRefresh();
      if(!ok) return toast('No data in Firebase','wa');
      toast('Pulled from Firebase','ok');
      App.audit('FB Pull','system','');
      adminShell(); App.go('dashboard');
    }catch(e){ toast('Pull failed: '+e.message,'err'); }
  },
};

function showPublic(){
  $('#app').classList.add('hide');
  $('#pub').classList.remove('hide');
  IP.closeMobileMenu();
  publicPage();
}
function showAdmin(){
  $('#pub').classList.add('hide');
  $('#app').classList.remove('hide');
  adminShell();
  const t = DataService.raw().settings.theme;
  if(t && t!=='auto') document.documentElement.dataset.theme = t;
}

document.addEventListener('keydown', e => { if(e.key==='Escape'){ App.close(); closePopup(); IP.closeMobileMenu(); } });

window.addEventListener('DOMContentLoaded', () => {
  if(!document.documentElement.dataset.theme){
    document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  setTimeout(async () => {
    $('#load').classList.add('out');
    setTimeout(()=>{ $('#load').style.display='none'; }, 600);
    // Wait for Firebase initial sync before showing UI (5s max)
    if(DataService.isFirebaseReady()){
      await DataService.waitForInitialSync(5000);
    }
    if(Auth.restore()){ showAdmin(); App.go('dashboard'); }
    else showPublic();
  }, 1200);
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if(window.innerWidth > 900){ IP.closeMobileMenu(); }
  }, 150);
});

/* Update sync badge when connection changes */
window.addEventListener('firebase-connection', (e)=>{
  const badge = document.getElementById('syncBadge');
  if(badge){
    const connected = e.detail && e.detail.connected;
    badge.textContent = connected ? '🟢 Live Sync' : '⚪ Offline';
    badge.className = 'sync-badge ' + (connected ? 'on' : 'off');
  }
});

let renderDebounce = null;
window.addEventListener('ipak-data-changed', (e)=>{
  clearTimeout(renderDebounce);
  renderDebounce = setTimeout(()=>{
    try{
      if(currentUser){
        // Refresh currentUser in case their record changed on another device
        Auth.refresh();
        const activePage = App.page;
        if(['dashboard','daily','reports','reports_daily','menu','monthly','complaints',
            'feedback','waste','announcements','popups','users','audit','rates',
            'quickactions','categories','notifications','analytics'].includes(activePage)){
          App.go(activePage);
        }
      } else {
        publicPage();
      }
    }catch(err){ console.warn('Live re-render failed', err); }
  }, 350);
});

/* Periodic refresh from Firebase every 60 seconds (safety net) */
setInterval(()=>{
  if(DataService.isFirebaseReady() && !document.hidden){
    DataService.forceRefresh().catch(()=>{});
  }
}, 60000);

/* Refresh on tab becoming visible again */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && DataService.isFirebaseReady()){
    DataService.forceRefresh().catch(()=>{});
  }
});

if('serviceWorker' in navigator){
  const sw = `self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>self.clients.claim());
self.addEventListener('fetch',e=>{e.respondWith(caches.open('ipak').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch(_){} return res}).catch(()=>c.match('/')))))});`;
  try{
    const blob = new Blob([sw], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}

})();
</script>
