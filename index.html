<style>
:root{
  --p:#0f4c5c;--p2:#177e93;--ac:#e67e22;--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;
  --ok:#10b981;--wa:#f59e0b;--er:#ef4444;--side:#0a2f3a;--sh:0 2px 8px #0001;
}
[data-theme=dark]{
  --bg:#0b1620;--card:#132532;--tx:#e6eef3;--mu:#94a3b8;--bd:#25394a;--side:#06202a;--sh:0 2px 10px #0006;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:14px/1.4 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
img,svg{max-width:100%}

button, .btn, a, .qa button, .qa-item, .cat-chip, .menu-day, .meal, .kpi, .rate-card,
.qa-card, .day-entry, .alert, .perm-item, input, select, textarea, label{ transition: all .18s ease; }
input:hover, select:hover, textarea:hover{ border-color: var(--p2); box-shadow: 0 0 0 3px #177e9318; }
input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--p2); box-shadow: 0 0 0 4px #177e9322; transform: translateY(-1px); }
.btn:hover, button:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px #0002; filter:brightness(1.08); }
.btn:active, button:active{ transform: translateY(0); box-shadow: 0 2px 6px #0002; }
.qa button:hover, .qa-item:hover{ transform: translateY(-3px); }
.cat-chip:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px #0002; }
.kpi:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px #0002; }
.meal:hover, .menu-day:hover, .rate-card:hover, .qa-card:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px #0002; }
.day-entry:hover{ border-color: var(--p2); box-shadow: 0 4px 12px #0001; }
.side a:hover{ padding-left: 16px; }

#load{position:fixed;inset:0;background:linear-gradient(135deg,#0a2f3a 0%,#177e93 55%,#e67e22 130%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999;transition:opacity .5s}
#load.out{opacity:0;pointer-events:none}
#load .kitchen{position:relative;width:180px;height:120px;display:flex;align-items:flex-end;justify-content:center;gap:8px}
#load .pan{width:70px;height:34px;border-radius:0 0 34px 34px;background:#2c2c2c;position:relative;box-shadow:inset 0 -3px 0 #000}
#load .pan:after{content:"";position:absolute;right:-24px;bottom:8px;width:28px;height:6px;background:#2c2c2c;border-radius:4px}
#load .chef{font-size:46px;animation:chef 1.4s ease-in-out infinite}
#load .steam{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;gap:4px}
#load .steam i{width:5px;height:22px;background:#fff7;border-radius:3px;animation:steam 1.6s ease-in-out infinite}
#load .steam i:nth-child(2){animation-delay:.3s}
#load .steam i:nth-child(3){animation-delay:.6s}
#load b.brand{font-size:52px;letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,#fff,#ffd9a8);-webkit-background-clip:text;background-clip:text;color:transparent}
#load .tag{font-size:15px;font-weight:600;opacity:.9}
#load .slogan{font-size:12px;letter-spacing:1px;opacity:.75;font-style:italic}
#load .bar{width:240px;height:5px;background:#fff3;border-radius:9px;overflow:hidden;margin-top:6px}
#load .bar:after{content:"";display:block;height:100%;background:var(--ac);animation:pg 1s forwards}
@keyframes chef{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px) scaleY(.6)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px) scaleY(1.2)}}
@keyframes pg{from{width:0}to{width:100%}}

.btn{border:0;background:var(--p);color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;min-height:36px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.btn.s{background:var(--bd);color:var(--tx)}
.btn.d{background:var(--er)}
.btn.a{background:var(--ac)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:5px 9px;font-size:12px;min-height:28px}
.btn.block{width:100%;justify-content:center}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);transition:.15s;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:var(--p2)}
input:invalid{border-color:var(--er)}
input[readonly]{background:var(--bg);font-weight:700;color:var(--ok)}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.req:after{content:" *";color:var(--er)}
.hint{font-size:11px;color:var(--mu);margin-top:3px}

.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--sh);margin-bottom:16px;overflow-x:auto}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h3 .h3l{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fg .f{grid-column:span 2}
.fg>div{min-width:0}
@media(max-width:640px){.fg{grid-template-columns:1fr}.fg .f{grid-column:auto}}

.tbl-wrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:.5px;background:var(--card);position:sticky;top:0;z-index:1}
tbody tr:hover{background:#177e9308}
tbody tr:last-child td{border-bottom:0}
tr.rev-row td{background:#10b98115;font-weight:700}
tr.selected-row td{background:#177e9318 !important}

input[type="checkbox"].row-check,
input[type="checkbox"].select-all-check{
  width:16px;height:16px;padding:0;accent-color:var(--p2);cursor:pointer;
  margin:0;box-shadow:none !important;transform:none !important;
}

.bulk-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(135deg,#0f4c5c,#177e93);color:#fff;
  padding:10px 14px;border-radius:10px;margin-bottom:12px;
  box-shadow:0 4px 14px #0f4c5c30;
  animation:bulkIn .25s ease;
}
@keyframes bulkIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.bulk-bar .bulk-count{ font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px; }
.bulk-bar .bulk-count b{ background:#fff;color:var(--p);padding:2px 10px;border-radius:99px; font-size:13px;min-width:26px;text-align:center; }
.bulk-bar .bulk-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bulk-bar .btn{background:#ffffff22;color:#fff;border:1px solid #ffffff33}
.bulk-bar .btn:hover{background:#ffffff33;border-color:#ffffff66}
.bulk-bar .btn.d{background:#ef4444cc;border-color:#ef4444}
.bulk-bar .btn.d:hover{background:#ef4444}
.bulk-bar .btn.ok{background:#10b981cc;border-color:#10b981}
.bulk-bar .btn.ok:hover{background:#10b981}

.tag{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#17709a22;color:var(--p2);display:inline-block}
.tag.g{background:#10b98122;color:var(--ok)}
.tag.r{background:#ef444422;color:var(--er)}
.tag.y{background:#f59e0b22;color:var(--wa)}
.tag.gray{background:#64748b22;color:var(--mu)}
.tag.money{background:#10b98122;color:var(--ok);font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;padding:14px;border-left:4px solid var(--p2);box-shadow:var(--sh);position:relative}
.kpi small{color:var(--mu);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.5px}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;line-height:1.1}
.kpi .v small{font-size:12px;margin-left:6px;font-weight:600}
.kpi.g{border-left-color:var(--ok)}.kpi.y{border-left-color:var(--wa)}.kpi.r{border-left-color:var(--er)}
.kpi.money{border-left-color:#10b981}
.kpi.water{border-left-color:#3b82f6}
.kpi .sub{font-size:10px;color:var(--mu);margin-top:2px;text-transform:none;letter-spacing:0;font-weight:600}

#pub{min-height:100vh;background:linear-gradient(160deg,#0a2f3a 0%,#177e93 60%,#e67e22 130%);padding:18px;color:#fff}
.pw{max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.greet{font-size:13px;opacity:.9;margin-top:3px}

.admin-login-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.35);
  padding:10px 18px;border-radius:10px;
  font-weight:700;font-size:14px;cursor:pointer;
  backdrop-filter:blur(6px);transition:all .2s ease;letter-spacing:.3px;
}
.admin-login-btn:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6);transform:translateY(-2px);box-shadow:0 8px 20px #0003;}
.admin-login-btn .ali{ font-size:16px; }

.ann{background:#fff2;border-radius:14px;padding:18px;margin:18px 0;border:1px solid #fff3;backdrop-filter:blur(6px)}
.ann h2{margin:0 0 6px;font-size:17px}
.ann .p{font-size:11px;font-weight:800;letter-spacing:1px;opacity:.85}
.pub-card{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.pub-card h3{margin:0 0 10px;color:var(--tx)}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.meal{border:1px solid var(--bd);border-radius:10px;padding:12px;position:relative}
.meal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.meal b{color:var(--p2);font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.meal .items{font-size:13px;line-height:1.4;color:var(--tx);margin-bottom:6px}
.meal small{color:var(--mu);font-size:11px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.qa button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:4px}
.qa button:hover{border-color:var(--ac);transform:translateY(-1px)}
.qa button .qai{font-size:18px;line-height:1}

.support-box{margin-top:18px;background:var(--card);color:var(--tx);border-radius:14px;padding:16px;box-shadow:var(--sh);}
.support-box h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--p2)}
.support-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);margin-bottom:8px;transition:.18s ease;text-decoration:none;color:var(--tx)}
.support-line:hover{background:#10b98115;transform:translateX(4px);box-shadow:0 4px 12px #0001}
.support-line .si{font-size:22px}
.support-line .sl-t{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.support-line .sl-v{font-size:14px;font-weight:800;color:var(--ok)}

#app{display:flex;min-height:100vh}
.side{width:240px;background:var(--side);color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;transition: width .28s ease, transform .28s ease;}
.side h2{font-size:16px;margin:4px 8px 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;font-size:13px;transition:.15s;text-decoration:none}
.side a:hover{background:#fff1;color:#fff}
.side a.on{background:var(--ac);color:#fff;font-weight:700}
.side .sec{font-size:10px;letter-spacing:1.5px;color:#7c98a5;margin:14px 10px 4px;font-weight:700;text-transform:uppercase}
.side .qa-menu{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.side .qa-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:#ffffff10;color:#e2e8f0;cursor:pointer;font-size:12px;font-weight:600;border:1px solid #ffffff15;transition:.15s}
.side .qa-item:hover{background:#e67e2233;border-color:var(--ac);color:#fff}
.main{flex:1;min-width:0;padding:18px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.hd h2{margin:0;font-size:20px}
.hd .hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bc{font-size:12px;color:var(--mu);margin-bottom:6px}
.bc b{color:var(--tx)}

.sync-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;
  background:#64748b22;color:var(--mu);transition:.2s;
}
.sync-badge.on{background:#10b98122;color:var(--ok)}
.sync-badge.syncing{background:#f59e0b22;color:var(--wa)}
.sync-badge.off{background:#ef444422;color:var(--er)}

.mobile-menu-btn {
  display: none;
  background: var(--p);
  color: #fff;
  border: 0;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 20px;
  align-items: center;
  justify-content: center;
  transition: .2s;
  flex-shrink: 0;
  line-height: 1;
}
.mobile-menu-btn:hover { background: var(--p2); transform: translateY(-1px); box-shadow: 0 4px 12px #0002; }
.mobile-menu-btn:active { transform: translateY(0); }

.side-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 998;
  opacity: 0;
  transition: opacity .25s ease;
}
.side-overlay.on { display: block; opacity: 1; }

.side-close {
  display: none;
  position: absolute;
  top: 12px; right: 12px;
  background: transparent; border: 0; color: #fff;
  font-size: 16px; cursor: pointer;
  width: 34px; height: 34px; border-radius: 50%;
  align-items: center; justify-content: center;
  transition: .2s; z-index: 2; line-height: 1;
}
.side-close:hover { background: #ffffff22; transform: rotate(90deg); box-shadow: none; filter: none; }

.modal {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 12px;
  animation: modalFade .22s ease;
}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.mc{background:var(--card);border-radius:14px;padding:20px;width:min(680px,100%);max-height:92dvh;overflow:auto;box-shadow:0 20px 60px #0007;animation:mcin .3s ease}
@keyframes mcin{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.mc h3{margin:0 0 12px;font-size:18px}
.mc.wide{width:min(900px,100%)}

.mc:has(.login-modal), .mc.login-modal {
  width: auto !important;
  max-width: min(380px, 94vw) !important;
  padding: 0 !important;
  overflow: hidden !important;
  border-radius: 18px !important;
}
.login-modal{
  padding:0 !important; overflow:hidden !important;
  width:100%; max-width:min(380px,94vw);
  position:relative; display:flex; flex-direction:column;
  border-radius:18px !important; background:var(--card);
  box-shadow:0 25px 70px #0008, 0 0 0 1px #ffffff08 !important;
  animation:mcin .28s ease;
}
.login-modal .lm-close{
  position:absolute;top:12px;right:12px;
  background:transparent;border:0;color:var(--mu);
  font-size:16px;cursor:pointer;font-weight:700;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;line-height:1;z-index:5;
}
.login-modal .lm-close:hover{background:#ef444418;color:var(--er);transform:rotate(90deg)}

.login-modal .lm-form-panel{ padding:28px 24px 18px; background:var(--card); color:var(--tx); display:flex;flex-direction:column; width:100%; }
.login-modal .lm-form-head{ text-align:center; margin-bottom:18px; }
.login-modal .lm-form-icon{ width:52px;height:52px;margin:0 auto 10px;border-radius:14px; display:grid;place-items:center;font-size:24px; background:linear-gradient(135deg,#0f4c5c,#177e93); box-shadow:0 6px 18px #0f4c5c40; }
.login-modal .lm-form-kicker{ font-size:9px;font-weight:900;letter-spacing:1.6px;color:var(--p2); }
.login-modal .lm-form-head h3{ margin:5px 0 3px;font-size:19px;line-height:1.2; letter-spacing:-.2px;color:var(--tx);font-weight:800; }
.login-modal .lm-form-head p{ margin:0;color:var(--mu);font-size:12px; }
.login-modal .lm-field{margin-bottom:12px}
.login-modal .lm-field label{ font-size:11px !important;font-weight:800 !important; color:var(--tx) !important;margin:0 0 5px !important; text-transform:none !important;letter-spacing:.1px !important; }
.login-modal .lm-input{position:relative}
.login-modal .lm-input .lm-ico{ position:absolute;left:11px;top:50%;transform:translateY(-50%); font-size:14px;opacity:.6;pointer-events:none; }
.login-modal .lm-input input{ height:40px !important; padding:8px 40px 8px 34px !important; border-radius:10px !important; background:var(--bg) !important; border:1px solid var(--bd) !important; font-size:13px !important; width:100% !important; }
.login-modal .lm-input input#lm_u{padding-right:12px !important}
.login-modal .lm-input input:focus{ background:var(--card) !important; box-shadow:0 0 0 3px #177e9320 !important; }
.login-modal .lm-input .toggle-password{ position:absolute;right:6px;top:50%;transform:translateY(-50%); background:none;border:none;cursor:pointer; color:var(--mu);border-radius:8px;font-size:15px;padding:5px 7px; }
.login-modal .lm-input .toggle-password:hover{ background:var(--bd);transform:translateY(-50%) !important; }
.login-modal .lm-caps{ display:none;margin-top:5px;font-size:11px;color:var(--wa);font-weight:700; }
.login-modal .lm-caps.on{display:block}
.login-modal .lm-row{ display:flex;justify-content:space-between;align-items:center; gap:6px;margin:2px 0 12px !important;font-size:11.5px; }
.login-modal .lm-remember{ display:flex;align-items:center;gap:6px;cursor:pointer; margin:0 !important;font-weight:600 !important;color:var(--mu) !important; text-transform:none !important;letter-spacing:0 !important;font-size:11.5px; }

.popup-overlay{ position:fixed;inset:0;background:rgba(15,23,42,.55); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%); display:flex;align-items:center;justify-content:center;z-index:1500;padding:16px; animation:fadeIn .25s ease; }

<script>
/* ============================================================
   IPAK EMPLOYEE MESS MANAGEMENT SYSTEM v15.0 ADVANCED
   - Operations: Meal Data Submission, Water Consumption,
     Food Waste, Bread Waste (each with CRUD + sub-items)
   - Dashboard: Meals Served / Food Waste / Water Consumption
     for Today, Yesterday, Current Month
   - No Quick Actions
   ============================================================ */
(()=>{
'use strict';

const firebaseFn = name => (...args) => {
  const api = window.__IPAK_FIRESTORE_API;
  if(!api || typeof api[name] !== 'function') throw new Error(`Firebase SDK function ${name} is not ready`);
  return api[name](...args);
};
const collection = firebaseFn('collection');
const doc = firebaseFn('doc');
const setDoc = firebaseFn('setDoc');
const deleteDoc = firebaseFn('deleteDoc');
const getDoc = firebaseFn('getDoc');
const getDocs = firebaseFn('getDocs');
const onSnapshot = firebaseFn('onSnapshot');
const writeBatch = firebaseFn('writeBatch');
const serverTimestamp = (...args) => {
  const api = window.__IPAK_FIRESTORE_API;
  if(!api || typeof api.serverTimestamp !== 'function') throw new Error('Firebase SDK function serverTimestamp is not ready');
  return api.serverTimestamp(...args);
};

const CONFIG = {
  appName: 'IPAK Employee Mess Management System',
  brand: 'IPAK Employee Services',
  slogan: 'Serving Better. Managing Smarter.',
  timezone: 'Asia/Karachi',
  currency: 'PKR',
  storageKey: 'ipakMess_v14_firestore',
  dateFormat: 'YYYY-MM-DD',
  copyright: '© 2026 IPAK Employee Mess Management System',
  whatsappMain: '+92 322 2818107',
  whatsappMainLink: '923222818107',
  support: [
    {label:'Employee Services Helpline', number:'+92 370 4725111', link:'923704725111', icon:'📞'},
    {label:'Mess Help Line',              number:'+92 314 4725777', link:'923144725777', icon:'🍽️'},
  ],
};

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PRIORITIES = ['Normal','High','Urgent'];
const COMPLAINT_STATUS = ['Submitted','Under Review','In Progress','Resolved','Closed'];

const PERMISSIONS = [
  {key:'dashboard',   label:'Dashboard'},
  {key:'operations',  label:'Operations (All Heads)'},
  {key:'menu',        label:'Menu Management'},
  {key:'categories',  label:'Categories'},
  {key:'complaints',  label:'Complaints'},
  {key:'feedback',    label:'Feedback'},
  {key:'reports',     label:'Reports'},
  {key:'analytics',   label:'Analytics'},
  {key:'announcements',label:'Announcements'},

  {key:'popups',      label:'Popup Messages'},
  {key:'users',       label:'Users'},
  {key:'audit',       label:'Audit Log'},
  {key:'settings',    label:'Settings'},
  {key:'export',      label:'Backup / Export'},
  {key:'rates',       label:'Paid Meal Rates'},
];

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const lt = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const ago = n => { const d=new Date(); d.setDate(d.getDate()-n); return lt(d); };
const TODAY = lt(new Date());
const nowISO = () => new Date().toISOString();
const monthOf = d => (d||TODAY).slice(0,7);
const monthLabel = m => {
  const [y,mo] = m.split('-');
  return new Date(y, +mo-1, 1).toLocaleString('en',{month:'long', year:'numeric'});
};
const addMonths = (m, delta) => {
  const [y,mo] = m.split('-');
  const d = new Date(+y, +mo-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
};
const dateRange = (from, to) => {
  const out = [];
  const a = new Date(from+'T00:00:00');
  const b = new Date(to+'T00:00:00');
  if(isNaN(a) || isNaN(b) || a > b) return out;
  const cur = new Date(a);
  let guard = 0;
  while(cur <= b && guard++ < 400){
    out.push(lt(cur));
    cur.setDate(cur.getDate()+1);
  }
  return out;
};

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = v => Number(v||0).toLocaleString('en-US');
const money = v => N(Math.round(v||0)) + ' ' + CONFIG.currency;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const mins = t => { const [h,m]=(t||'00:00').split(':'); return (+h)*60 + (+m); };
const nowMin = () => { const d=new Date(); return d.getHours()*60 + d.getMinutes(); };
const dayName = d => DAYS[new Date(d+'T00:00:00').getDay()];

function toast(msg, type='', ms=2600){
  const el = document.createElement('div');
  el.className = type;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, ms);
}

/* ============================================================
   DataService — Cloud Firestore backed
   ============================================================ */
const DataService = (()=>{
  let DB = null;
  let fbReady = false;
  let fbConnected = false;
  let initialSyncDone = false;
  let listeners = [];

  const COLLECTIONS = [
    'users','reports','menu','timings','complaints','feedback','waste',
    'water','breadWaste','inventory','vendors','purchases','hygiene','temperatures',
    'announcements','notifications','popupMessages','audit'
  ];
  const CONFIG_COLLECTIONS = ['meta','settings','categories','paidMealRates'];
  const LOCAL_KEY = CONFIG.storageKey;

  function seedRates(){
    return {'Chicken':350,'Vegetable':250,'Beef':500,'Mutton':700,'Fish':450,'Special':600};
  }

  function seed(){
    const rates = seedRates();
    const adminPerms = PERMISSIONS.map(p=>p.key);
    return {
      meta:{version:15, seededAt:nowISO()},
      users:[
        {id:'U1',username:'superadmin',password:'admin123',name:'Super Admin',role:'superadmin',active:'Yes',permissions:adminPerms,createdAt:nowISO()},
        {id:'U2',username:'admin',password:'admin123',name:'Site Admin',role:'admin',active:'Yes',permissions:adminPerms,createdAt:nowISO()},
        {id:'U3',username:'manager',password:'admin123',name:'Mess Manager',role:'manager',active:'Yes',permissions:['dashboard','operations','menu','categories','complaints','feedback','analytics','announcements','notifications','popups','reports','export','rates'],createdAt:nowISO()},
        {id:'U4',username:'entry',password:'admin123',name:'Data Entry',role:'entry',active:'Yes',permissions:['dashboard','operations'],createdAt:nowISO()},
        {id:'U5',username:'viewer',password:'admin123',name:'Viewer',role:'viewer',active:'Yes',permissions:['dashboard','reports','analytics','export'],createdAt:nowISO()}
      ],
      reports:[], menu:[],
      timings:[['Breakfast','07:00','08:30'],['Morning Tea','10:30','11:00'],['Lunch','13:00','14:30'],['Evening Tea','16:30','17:00'],['Dinner','20:00','21:30'],['Midnight Tea','23:30','23:59']].map((t,i)=>({id:'T'+(i+1),meal:t[0],start:t[1],end:t[2]})),
      complaints:[], feedback:[], waste:[], water:[], breadWaste:[],
      inventory:[], vendors:[], purchases:[], hygiene:[], temperatures:[],
      announcements:[], notifications:[], popupMessages:[], audit:[],
      categories:{
        meal:['Breakfast','Morning Tea','Lunch','Evening Tea','Dinner','Midnight Tea'],
        paidMealCat:Object.keys(rates),
        food:['Bread','Food'],
        waterSource:['Drinking Water','Cooking Water','Washing Water'],
        breadType:['White Bread','Brown Bread','Bun','Rusk'],
        complaint:['Food Quality','Taste','Quantity','Hygiene','Timing','Service','Menu','Other'],
        wasteReason:['Overcooking','Low turnout','Spoiled','Customer return','Other'],
        unit:['KG','L','Pcs','Pkt','Dozen','Tin'],
        announcement:['General','Menu Change','Timing Update','Holiday','Maintenance']
      },
      paidMealRates:rates,
      settings:{company:'IPAK Employee Services',site:'Head Office',mess:'Main Mess',currency:'PKR',timezone:'Asia/Karachi',target:7,theme:'auto',logo:'',popupsEnabled:'Yes',popupDelay:800}
    };
  }

  function clone(v){try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}}
  function loadLocal(){try{const p=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return p&&p.meta?p:null;}catch(e){return null;}}
  function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(DB));}catch(e){}}
  function normalize(){
    COLLECTIONS.filter(c=>c!=='audit').forEach(k=>{if(!Array.isArray(DB[k])) DB[k]=DB[k]&&typeof DB[k]==='object'?Object.values(DB[k]):[];});
    if(!Array.isArray(DB.audit)) DB.audit=DB.audit&&typeof DB.audit==='object'?Object.values(DB.audit):[];
    if(!DB.categories||typeof DB.categories!=='object'||Array.isArray(DB.categories)) DB.categories={};
    if(!DB.paidMealRates||typeof DB.paidMealRates!=='object'||Array.isArray(DB.paidMealRates)) DB.paidMealRates={};
    if(!DB.settings||typeof DB.settings!=='object') DB.settings={};
    if(!DB.meta||typeof DB.meta!=='object') DB.meta={version:14};
  }

  function col(name){return collection(window.__IPAK_FIRESTORE,name);}
  function docRef(name,id){return doc(col(name),String(id));}

  async function readCollection(name){
    const snap=await getDocs(col(name));
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  }
  async function readConfig(name){
    const snap=await getDoc(docRef(name,'config'));
    return snap.exists()?snap.data():null;
  }
  async function writeRecord(collName,rec){
    const data={...clone(rec),updatedAt:serverTimestamp()};
    await setDoc(docRef(collName,rec.id),data,{merge:true});
  }
  async function deleteRecord(collName,id){await deleteDoc(docRef(collName,id));}

  async function seedFirestore(){
    const existingUsers=await getDocs(col('users'));
    if(!existingUsers.empty) return false;
    const fresh=seed();
    const batch=writeBatch(window.__IPAK_FIRESTORE);
    for(const c of COLLECTIONS.filter(x=>x!=='audit')){
      const arr=Array.isArray(fresh[c])?fresh[c]:[];
      for(const r of arr) if(r&&r.id) batch.set(docRef(c,r.id),clone(r));
    }
    batch.set(docRef('meta','config'),clone(fresh.meta));
    batch.set(docRef('settings','config'),clone(fresh.settings));
    batch.set(docRef('categories','config'),clone(fresh.categories));
    batch.set(docRef('paidMealRates','config'),clone(fresh.paidMealRates));
    await batch.commit();
    return true;
  }

  async function loadAllRemote(){
    const tasks = COLLECTIONS.map(async c => {
      const rows = await readCollection(c);
      return [c, rows];
    });
    const results = await Promise.all(tasks);
    const fresh = seed();
    results.forEach(([c, rows]) => { fresh[c] = rows; });
    const [meta, settings, categories, rates] = await Promise.all([
      readConfig('meta').catch(()=>null),
      readConfig('settings').catch(()=>null),
      readConfig('categories').catch(()=>null),
      readConfig('paidMealRates').catch(()=>null),
    ]);
    if(meta) fresh.meta = meta;
    if(settings) fresh.settings = settings;
    if(categories) fresh.categories = categories;
    if(rates) fresh.paidMealRates = rates;
    DB = fresh; normalize(); saveLocal();
  }

  function attachListeners(){
    listeners.forEach(un=>{try{un();}catch(e){}}); listeners=[];
    for(const c of COLLECTIONS){
      const un=onSnapshot(col(c),snap=>{
        if(!DB) return;
        DB[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
        normalize(); saveLocal(); notifyChange(c);
      },err=>console.warn('Firestore listener',c,err));
      listeners.push(un);
    }
    for(const c of CONFIG_COLLECTIONS){
      const un=onSnapshot(docRef(c,'config'),snap=>{
        if(!DB||!snap.exists()) return;
        DB[c==='meta'?'meta':c]=snap.data(); normalize(); saveLocal(); notifyChange(c);
      },err=>console.warn('Firestore config listener',c,err));
      listeners.push(un);
    }
  }

  async function bootFirebase(){
    try{
      if(!window.__IPAK_FIRESTORE_READY) await new Promise(r=>{const f=()=>r();window.addEventListener('firebase-ready',f,{once:true});setTimeout(r,2000);});
      if(!window.__IPAK_FIRESTORE) throw new Error('Firestore is not initialized');
      fbReady=true;
      seedFirestore().catch(e=>console.warn('Seed failed', e));
      await loadAllRemote();
      attachListeners();
      fbConnected=true;
      initialSyncDone=true;
      window.dispatchEvent(new CustomEvent('firebase-connection',{detail:{connected:true}}));
      window.dispatchEvent(new Event('ipak-initial-sync-done'));
      return true;
    }catch(e){
      console.warn('Firestore boot failed:',e);
      fbConnected=false;initialSyncDone=true;
      window.dispatchEvent(new CustomEvent('firebase-connection',{detail:{connected:false}}));
      window.dispatchEvent(new Event('ipak-initial-sync-done'));
      return false;
    }
  }

  function bootLocal(){DB=loadLocal()||seed();normalize();saveLocal();}
  function notifyChange(coll){
    try{ window.dispatchEvent(new CustomEvent('ipak-data-changed',{detail:{coll}})); }catch(e){}
  }

  function all(coll){return DB[coll]||[];}
  function get(coll,id){return all(coll).find(r=>r.id===id)||null;}

  function insert(coll,rec){
    rec={...rec}; rec.id=rec.id||uid((coll||'x')[0].toUpperCase()); rec.createdAt=rec.createdAt||nowISO(); rec.updatedAt=nowISO();
    if(!DB[coll]) DB[coll]=[];
    DB[coll].push(rec); saveLocal(); notifyChange(coll);
    if(fbReady) writeRecord(coll,rec).catch(e=>console.warn('Firestore write failed',coll,rec.id,e));
    return rec;
  }
  function update_(coll,id,patch){
    const r=get(coll,id); if(!r)return null; Object.assign(r,patch,{updatedAt:nowISO()}); saveLocal(); notifyChange(coll);
    if(fbReady) writeRecord(coll,r).catch(e=>console.warn('Firestore update failed',coll,id,e)); return r;
  }
  function remove_(coll,id){
    DB[coll]=(DB[coll]||[]).filter(r=>r.id!==id); saveLocal(); notifyChange(coll);
    if(fbReady) deleteRecord(coll,id).catch(e=>console.warn('Firestore delete failed',coll,id,e));
  }
  function removeMany_(coll,ids){
    if(!Array.isArray(ids)||!ids.length)return 0; const set=new Set(ids), before=(DB[coll]||[]).length; DB[coll]=(DB[coll]||[]).filter(r=>!set.has(r.id)); saveLocal(); notifyChange(coll);
    if(fbReady) Promise.all(ids.map(id=>deleteRecord(coll,id))).catch(e=>console.warn('Firestore bulk delete failed',e)); return before-DB[coll].length;
  }

  async function replaceAll(newDB){
    DB=clone(newDB||seed()); normalize(); saveLocal();
    for(const c of COLLECTIONS){
      const existing=await getDocs(col(c)); const batch=writeBatch(window.__IPAK_FIRESTORE); existing.forEach(d=>batch.delete(d.ref)); await batch.commit();
      const arr=Array.isArray(DB[c])?DB[c]:[];
      for(let i=0;i<arr.length;i+=400){const b=writeBatch(window.__IPAK_FIRESTORE);arr.slice(i,i+400).forEach(r=>{if(r&&r.id)b.set(docRef(c,r.id),clone(r));});await b.commit();}
    }
    await syncConfig('meta',DB.meta); await syncConfig('settings',DB.settings); await syncConfig('categories',DB.categories); await syncConfig('paidMealRates',DB.paidMealRates); notifyChange('*');
  }

  function raw(){return DB;}
  function getCats(key){return DB.categories?.[key]||[];}
  function syncConfig(key,value){DB[key]=value;saveLocal();if(fbReady)return setDoc(docRef(key,'config'),clone(value),{merge:false}).catch(e=>console.warn('Firestore config write failed',key,e));}
  function addCat(key,val){if(!DB.categories)DB.categories={};if(!DB.categories[key])DB.categories[key]=[];if(DB.categories[key].includes(val))return false;DB.categories[key].push(val);syncConfig('categories',DB.categories);notifyChange('categories');return true;}
  function editCat(key,oldVal,newVal){const arr=DB.categories?.[key];if(!arr||arr.includes(newVal))return false;const i=arr.indexOf(oldVal);if(i<0)return false;arr[i]=newVal;syncConfig('categories',DB.categories);notifyChange('categories');return true;}
  function delCat(key,val){if(!DB.categories?.[key])return false;DB.categories[key]=DB.categories[key].filter(c=>c!==val);syncConfig('categories',DB.categories);notifyChange('categories');return true;}
  function usageCount(coll,field,val){return (DB[coll]||[]).filter(r=>r[field]===val).length;}
  function getRate(cat){return +(DB.paidMealRates?.[cat]||0);}
  function getRates(){return DB.paidMealRates||{};}
  function setRate(cat,rate){if(!DB.paidMealRates)DB.paidMealRates={};DB.paidMealRates[cat]=+rate||0;syncConfig('paidMealRates',DB.paidMealRates);notifyChange('paidMealRates');}
  function renameRate(oldCat,newCat){if(!DB.paidMealRates||!(oldCat in DB.paidMealRates)||newCat in DB.paidMealRates)return false;DB.paidMealRates[newCat]=DB.paidMealRates[oldCat];delete DB.paidMealRates[oldCat];syncConfig('paidMealRates',DB.paidMealRates);notifyChange('paidMealRates');return true;}
  function deleteRate(cat){if(!DB.paidMealRates)return false;delete DB.paidMealRates[cat];syncConfig('paidMealRates',DB.paidMealRates);notifyChange('paidMealRates');return true;}
  function getPopups(filter){let list=[...(DB.popupMessages||[])];if(filter){if(filter.enabled!==undefined)list=list.filter(p=>p.enabled===filter.enabled);if(filter.audience)list=list.filter(p=>p.audience===filter.audience||p.audience==='All');}return list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));}
  function getActivePopups(){return getPopups({enabled:'Yes'}).filter(p=>(p.start||'0000-00-00')<=TODAY&&(p.end||'9999-99-99')>=TODAY);}
  function markPopupShown(id){try{const shown=JSON.parse(localStorage.getItem('ipakPopupsShown')||'[]');if(!shown.includes(id)){shown.push(id);localStorage.setItem('ipakPopupsShown',JSON.stringify(shown.slice(-100)));}}catch(e){}}
  function clearPopupShown(){try{localStorage.removeItem('ipakPopupsShown');}catch(e){}}
  function syncSingleton(key,value){return syncConfig(key,value);}
  function reset(){const fresh=seed();DB=fresh;normalize();saveLocal();if(fbReady)replaceAll(fresh).catch(e=>console.warn('Reset failed',e));notifyChange('*');}
  function isReady(){return fbReady;}
  function hasInitialSync(){return initialSyncDone;}
  function waitForInitialSync(timeoutMs=3000){
    if(initialSyncDone) return Promise.resolve(true);
    return new Promise(resolve=>{
      const timer = setTimeout(()=>resolve(false), timeoutMs);
      window.addEventListener('ipak-initial-sync-done',()=>{clearTimeout(timer);resolve(true);},{once:true});
    });
  }
  async function refreshCollection(name){
    if(!fbReady || !COLLECTIONS.includes(name)) return false;
    try{
      const rows = await readCollection(name);
      DB[name] = rows;
      normalize();
      saveLocal();
      notifyChange(name);
      return true;
    }catch(e){
      console.warn('Firestore collection refresh failed',name,e);
      return false;
    }
  }
  async function forceRefresh(){if(!fbReady)return false;try{await loadAllRemote();notifyChange('*');return true;}catch(e){console.warn('Force refresh failed',e);return false;}}
  async function flushPendingWrites(){return true;}

  bootLocal();
  bootFirebase().then(ok=>{
    if(ok) console.log('IPAK Mess Firestore sync active');
    setTimeout(()=>{try{if(window.IP){if(currentUser)App.go(App.page||'dashboard');else publicPage();}}catch(e){}},50);
  });
  window.addEventListener('firebase-connection',e=>{fbConnected=!!(e.detail&&e.detail.connected);});

  return {all,get,insert,update:update_,remove:remove_,removeMany:removeMany_,reset,replaceAll,raw,save:saveLocal,getCats,addCat,editCat,delCat,usageCount,getRate,getRates,setRate,renameRate,deleteRate,getPopups,getActivePopups,markPopupShown,clearPopupShown,syncSingleton,isFirebaseReady:isReady,hasInitialSync,waitForInitialSync,refreshCollection,forceRefresh,flushPendingWrites};
})();

const ROLES = {
  superadmin:{label:'Super Admin'},
  admin:     {label:'Admin'},
  manager:   {label:'Mess Manager'},
  entry:     {label:'Data Entry'},
  viewer:    {label:'Viewer'},
};

let currentUser = null;

function userHasPerm(p){
  if(!currentUser) return false;
  if(currentUser.role==='superadmin' || currentUser.role==='admin') return true;
  if(!Array.isArray(currentUser.permissions)) return false;
  return currentUser.permissions.includes(p);
}

function canW(p){
  if(!currentUser) return false;
  if(currentUser.role==='superadmin' || currentUser.role==='admin') return true;
  if(!Array.isArray(currentUser.permissions) || !currentUser.permissions.includes(p)) return false;
  return ['operations','menu','categories','complaints','feedback','announcements','rates','popups'].includes(p);
}

async function hashPw(pw){
  if(!(window.crypto && crypto.subtle)) return pw;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ipak::'+pw));
  return 'h$'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const isHashed = v => typeof v==='string' && v.startsWith('h$');

const LOCK = { max:5, secs:30, key:'ipakLock_v14' };
const SESSION = { key:'ipakSess_v14', idleMin:20 };
let idleTimer = null;

const Auth = {
  lockLeft(){
    try{
      const l = JSON.parse(localStorage.getItem(LOCK.key)||'{}');
      return l.until && l.until>Date.now() ? Math.ceil((l.until-Date.now())/1000) : 0;
    }catch(e){ return 0; }
  },
  _fail(){
    let l={n:0};
    try{ l = JSON.parse(localStorage.getItem(LOCK.key)||'{"n":0}'); }catch(e){}
    l.n = (l.n||0)+1;
    if(l.n>=LOCK.max){ l.until = Date.now()+LOCK.secs*1000; l.n = 0; }
    try{ localStorage.setItem(LOCK.key, JSON.stringify(l)); }catch(e){}
  },
  async login(username, password){
    const wait = this.lockLeft();
    if(wait) throw new Error(`Too many attempts. Try again in ${wait}s.`);

    if(DataService.isFirebaseReady()){
      await DataService.waitForInitialSync(1500);
    }

    const cleanUsername = String(username || '').trim().toLowerCase();
    let u = DataService.all('users').find(x =>
      String(x.username || '').toLowerCase()===cleanUsername && x.active==='Yes');
    let ok = false;

    if(!u){
      const builtIn = seed().users.find(x =>
        String(x.username || '').toLowerCase()===cleanUsername && x.active==='Yes');
      if(builtIn && password === builtIn.password){
        u = builtIn;
        ok = true;
        try{
          if(DataService.isFirebaseReady()) DataService.insert('users', builtIn);
        }catch(e){}
      }
    }

    if(u && !ok){
      if(isHashed(u.password)) ok = (u.password === await hashPw(password));
      else if(u.password===password){
        ok = true;
        const h = await hashPw(password);
        if(isHashed(h)) DataService.update('users', u.id, {password:h});
      }
    }
    if(!ok){ this._fail(); throw new Error('Invalid username or password'); }
    try{ localStorage.removeItem(LOCK.key); }catch(e){}
    currentUser = u;
    try{ sessionStorage.setItem(SESSION.key, u.id); }catch(e){}
    App.audit('Login', 'Auth');
    this.startIdle();
    return u;
  },
  restore(){
    try{
      const id = sessionStorage.getItem(SESSION.key);
      const u = id && DataService.get('users', id);
      if(u && u.active==='Yes'){ currentUser = u; this.startIdle(); return u; }
    }catch(e){}
    return null;
  },
  refresh(){
    if(!currentUser) return;
    const fresh = DataService.get('users', currentUser.id);
    if(!fresh) return;
    if(fresh.active !== 'Yes'){
      toast('Your account was deactivated','err',4000);
      Auth.logout(); showPublic();
      return;
    }
    currentUser = fresh;
  },
  startIdle(){
    const reset = () => {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(()=>{
        if(!currentUser) return;
        Auth.logout(); showPublic(); toast('Signed out due to inactivity','wa',4000);
      }, SESSION.idleMin*60*1000);
    };
    if(!this._idleBound){
      ['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, ()=>{ if(currentUser) reset(); }, {passive:true}));
      this._idleBound = true;
    }
    reset();
  },
  logout(){
    if(currentUser) App.audit('Logout','Auth');
    currentUser = null;
    clearTimeout(idleTimer);
    try{ sessionStorage.removeItem(SESSION.key); }catch(e){}
    App.close();
  },
  user(){ return currentUser; }
};

const V = {

  date(v){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')) return false; const d=new Date(v+'T00:00:00'); return !isNaN(d); },
  futureDate(v){ return this.date(v) && v > TODAY; },
};

function startEmployeeMenuRealtime(){
  if(employeeMenuSyncStarted) return;
  if(currentUser || !DataService.isFirebaseReady() || !window.__IPAK_FIRESTORE) return;

    const api = window.__IPAK_FIRESTORE_API;

function reportMeal(r){ return r && r.meal ? String(r.meal) : 'Unspecified'; }

function mealWiseSummary(reports){
  const mealCats = DataService.getCats('meal');
  const summary = {};
  mealCats.forEach(m => { summary[m] = { meals:0, emp:0, guest:0, contr:0, paidQty:0, revenue:0, reports:0 }; });
  (reports||[]).forEach(r => {
    const key = reportMeal(r);
    if(!summary[key]) summary[key] = { meals:0, emp:0, guest:0, contr:0, paidQty:0, revenue:0, reports:0 };
    summary[key].meals += totalMeals(r);
    summary[key].emp += (+r.emp||0);
    summary[key].guest += (+r.guest||0);
    summary[key].contr += (+r.contr||0);
    summary[key].paidQty += reportPaidMeals(r);
    summary[key].revenue += reportRevenue(r);
    summary[key].reports++;
  });
  return summary;
}

function mealWiseFromWaste(reportDates, mealFilter=''){
  const mealCats = DataService.getCats('meal');
  const summary = {};
  mealCats.forEach(m => summary[m] = { waste:0, prepared:0, served:0, returned:0, records:0 });
  const dateSet = new Set(reportDates || []);
  DataService.all('waste').forEach(w => {
    if(!dateSet.has(w.date)) return;
    if(mealFilter && w.meal!==mealFilter) return;
    if(!summary[w.meal]) summary[w.meal] = { waste:0, prepared:0, served:0, returned:0, records:0 };
    summary[w.meal].waste += (+w.waste || 0);
    summary[w.meal].prepared += (+w.prepared || 0);
    summary[w.meal].served += (+w.served || 0);
    summary[w.meal].returned += (+w.returned || 0);
    summary[w.meal].records++;
  });
  return summary;
}

const DF = {
  period: 'today',

function dfDates(){
  const today = new Date();
  const mk = n => { const d = new Date(today); d.setDate(d.getDate()+n); return lt(d); };
  switch(DF.period){
    case 'today':     return [TODAY, TODAY];
    case 'yesterday': return [mk(-1), mk(-1)];
    case 'week': {
      const day = today.getDay();
      return [mk(-day), mk(6-day)];
    }
    case 'month':     return [monthOf(TODAY)+'-01', TODAY];
    case 'last7':     return [mk(-6), TODAY];
    case 'last30':    return [mk(-29), TODAY];
    case 'custom':    return [DF.dateFrom || TODAY, DF.dateTo || TODAY];
    default:          return [TODAY, TODAY];
  }
}

function dfReports(){
  const [from, to] = dfDates();
  const all = DataService.all('reports');
  return all.filter(r => r.date >= from && r.date <= to);
}

function dfLabel(){
  const [from, to] = dfDates();
  if(from === to) return from;
  return from + ' → ' + to;
}

function filterReportsByCategory(reports, cat){
  if(!cat) return reports;
  return reports.filter(r => (r.paidMealsByCat||[]).some(x => x.category === cat));

function filterReportsByMeal(reports, meal){
  if(!meal) return reports;
  return reports.filter(r => reportMeal(r) === meal);
}

function dfFilteredReports(){
  let rows = dfReports();
  if(DF.meal) rows = filterReportsByMeal(rows, DF.meal);
  if(DF.category) rows = filterReportsByCategory(rows, DF.category);
  return rows;
}

/* Comparison: current period vs previous period */
function computeComparison(){
  const [from, to] = dfDates();
  const fromD = new Date(from+'T00:00:00');
  const toD = new Date(to+'T00:00:00');
  const spanDays = Math.max(1, Math.round((toD - fromD)/86400000) + 1);
  const prevTo = new Date(fromD); prevTo.setDate(prevTo.getDate()-1);
  const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(spanDays-1));
  const prevFromStr = lt(prevFrom), prevToStr = lt(prevTo);

  const allReports = DataService.all('reports');
  let curReports = allReports.filter(r => r.date >= from && r.date <= to);
  let prevReports = allReports.filter(r => r.date >= prevFromStr && r.date <= prevToStr);
  if(DF.category){
    curReports = filterReportsByCategory(curReports, DF.category);
    prevReports = filterReportsByCategory(prevReports, DF.category);
  }

  const sumMeals = arr => arr.reduce((s,r)=>s+totalMeals(r),0);
  const sumPaid = arr => arr.reduce((s,r)=>s+reportPaidMeals(r),0);
  const sumRev = arr => arr.reduce((s,r)=>s+reportRevenue(r),0);
  const sumWaste = arr => arr.reduce((s,r)=>s+(+r.waste||0),0);
  const sumPrep = arr => arr.reduce((s,r)=>s+(+r.prepared||0),0);
  const wastePct = arr => { const p = sumPrep(arr); return p ? (sumWaste(arr)/p*100) : 0; };

  return {
    current: {
      meals: sumMeals(curReports),
      paid: sumPaid(curReports),
      revenue: sumRev(curReports),
      waste: sumWaste(curReports),
      wastePct: wastePct(curReports),
      days: curReports.length,
    },
    previous: {
      meals: sumMeals(prevReports),
      paid: sumPaid(prevReports),
      revenue: sumRev(prevReports),
      waste: sumWaste(prevReports),
      wastePct: wastePct(prevReports),
      days: prevReports.length,
    },
    curLabel: from === to ? from : (from+' → '+to),
    prevLabel: prevFromStr === prevToStr ? prevFromStr : (prevFromStr+' → '+prevToStr),
  };
}

function deltaHtml(cur, prev, inverse=false, fmt=v=>N(v)){
  if(!prev && !cur) return `<span class="cc-delta flat">— no data</span>`;
  if(!prev) return `<span class="cc-delta up">▲ new</span>`;
  const diff = cur - prev;
  const pct = prev ? (diff/prev*100) : 0;
  const positiveIsGood = !inverse;
  const isUp = diff > 0;
  const isFlat = Math.abs(pct) < 0.5;
  let cls = 'flat', arrow = '▬';
  if(!isFlat){
    if((isUp && positiveIsGood) || (!isUp && !positiveIsGood)){ cls='up'; arrow='▲'; }
    else { cls='down'; arrow='▼'; }
  }
  const sign = diff > 0 ? '+' : '';
  return `<span class="cc-delta ${cls}">${arrow} ${sign}${fmt(diff)} (${sign}${pct.toFixed(1)}%)</span>`;
}

function compareCardsHtml(){
  const C = computeComparison();
  const bar = (cur, prev) => {
    const max = Math.max(cur, prev, 1);
    const pct = cur / max * 100;
    return `<div class="cc-bar"><i style="width:${pct.toFixed(0)}%"></i></div>`;
  };

  return `
    <div class="compare-grid">
      <div class="compare-card">
        <div class="cc-head"><span class="cc-title">🍽️ Total Meals</span></div>
        <div class="cc-current">${N(C.current.meals)}</div>
        <div class="cc-compare">Previous: ${N(C.previous.meals)} · ${esc(C.prevLabel)}</div>
        ${deltaHtml(C.current.meals, C.previous.meals)}
        ${bar(C.current.meals, C.previous.meals)}
      </div>
      <div class="compare-card">
        <div class="cc-head"><span class="cc-title">💰 Paid Meals</span></div>
        <div class="cc-current">${N(C.current.paid)}</div>
        <div class="cc-compare">Previous: ${N(C.previous.paid)} · ${esc(C.prevLabel)}</div>
        ${deltaHtml(C.current.paid, C.previous.paid)}
        ${bar(C.current.paid, C.previous.paid)}
      </div>
      <div class="compare-card">
        <div class="cc-head"><span class="cc-title">💵 Revenue</span></div>
        <div class="cc-current"><span class="tag money" style="font-size:16px">${money(C.current.revenue)}</span></div>
        <div class="cc-compare">Previous: ${money(C.previous.revenue)}</div>
        ${deltaHtml(C.current.revenue, C.previous.revenue, false, v=>money(v))}
        ${bar(C.current.revenue, C.previous.revenue)}
      </div>
      <div class="compare-card">
        <div class="cc-head"><span class="cc-title">🗑️ Waste (KG)</span></div>
        <div class="cc-current">${N(C.current.waste)} <small style="font-size:12px;color:var(--mu);font-weight:600">KG</small></div>
        <div class="cc-compare">Previous: ${N(C.previous.waste)} KG</div>
        ${deltaHtml(C.current.waste, C.previous.waste, true)}
        ${bar(C.current.waste, C.previous.waste)}
      </div>
      <div class="compare-card">
        <div class="cc-head"><span class="cc-title">📉 Waste %</span></div>
        <div class="cc-current">${C.current.wastePct.toFixed(1)}<small style="font-size:14px;font-weight:700">%</small></div>
        <div class="cc-compare">Previous: ${C.previous.wastePct.toFixed(1)}%</div>
        ${deltaHtml(+C.current.wastePct.toFixed(1), +C.previous.wastePct.toFixed(1), true, v=>v.toFixed(1)+'%')}
        ${bar(C.current.wastePct, C.previous.wastePct)}
      </div>
      <div class="compare-card">
        <div class="cc-head"><span class="cc-title">📅 Days Reported</span></div>
        <div class="cc-current">${N(C.current.days)}</div>
        <div class="cc-compare">Previous: ${N(C.previous.days)}</div>

}

let tableState = {coll:null, filters:{}, sort:null, page:1, perPage:25, selected:{}};

function getSelected(coll){
  if(!tableState.selected[coll]) tableState.selected[coll] = new Set();
  return tableState.selected[coll];
}
function clearSelection(coll){ tableState.selected[coll] = new Set(); }

function renderTable(coll){
  const cfg = TABLES[coll];
  if(!cfg) return toast('Unknown table','err');
  tableState.coll = coll;
  if(!tableState.sort) tableState.sort = cfg.sort || 'date-desc';
  if(!tableState.filters[coll]) tableState.filters[coll] = {};

  let rows;
  if(coll === 'audit'){
    rows = Object.values(DataService.raw().audit || {});
    rows.sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
  } else {
    rows = [...DataService.all(coll)];
  }
  const f = tableState.filters[coll];

  if(coll==='menu'){
    if(!f._month) f._month = monthOf(TODAY);
    rows = rows.filter(r => (r.month||r.date.slice(0,7))===f._month);
  }

  Object.entries(f).forEach(([k,v])=>{
    if(!v) return;
    if(k==='_dateFrom') rows = rows.filter(r=>r.date>=v);
    else if(k==='_dateTo') rows = rows.filter(r=>r.date<=v);
    else if(k==='_month') {}
    else if(k==='_q'){
      const q = v.toLowerCase();
      rows = rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
    } else rows = rows.filter(r=>String(r[k]).toLowerCase().includes(v.toLowerCase()));
  });

  if(coll !== 'audit'){
    const [sf, sd] = tableState.sort.split('-');
    rows.sort((a,b)=>{
      let av=a[sf], bv=b[sf];
      if(av===undefined) av=''; if(bv===undefined) bv='';
      if(!isNaN(+av) && !isNaN(+bv) && av!=='' && bv!==''){ av=+av; bv=+bv; }
      if(av<bv) return sd==='asc'?-1:1;
      if(av>bv) return sd==='asc'?1:-1;
      return 0;
    });
  }

  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total/tableState.perPage));

    : '';

  $('#pg').innerHTML = `
    <div class="card">

          <thead><tr>${headerCheck}${cfg.cols.map(c=>`<th>${esc(cfg.labels[c]||c)}</th>`).join('')}${coll==='reports'?'<th>Total</th><th>Waste %</th>':''}${!readonly?'<th>Actions</th>':''}</tr></thead>

async function saveUser(e, id){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form));
  const errs = [];
  if(!V.req(data.username)) errs.push('Username is required');
  if(!id && !V.req(data.password)) errs.push('Password is required');
  if(V.req(data.password) && String(data.password).length<6) errs.push('Password must be at least 6 characters');
  if(!V.req(data.name)) errs.push('Full Name is required');
  if(!V.req(data.role)) errs.push('Role is required');

  const dup = DataService.all('users').find(u=>u.username.toLowerCase()===String(data.username).toLowerCase() && u.id!==id);
  if(dup) errs.push('Username already exists');

  const isAdminRole = (data.role==='superadmin' || data.role==='admin');
  let permissions;
  if(isAdminRole) permissions = PERMISSIONS.map(p=>p.key);
  else {
    permissions = [];
    PERMISSIONS.forEach(p=>{
      const cb = form.querySelector(`input[name="perm_${p.key}"]`);
      if(cb && cb.checked) permissions.push(p.key);
    });
    if(!permissions.length) errs.push('Select at least one function for this user');
  }
  if(errs.length){ errs.forEach(m=>toast(m,'err',3200)); return false; }

  data.permissions = permissions;
  data.updatedAt = nowISO();
  if(V.req(data.password)) data.password = await hashPw(String(data.password));
  else delete data.password;

  if(id){ DataService.update('users', id, data); App.audit('Update User', 'users', data.username); }
  else { data.createdAt = nowISO(); DataService.insert('users', data); App.audit('Create User', 'users', data.username); }

  App.close(); toast('User saved','ok'); renderTable('users');
  return false;
}

  const row = document.createElement('div');

function saveForm(e, coll, id){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const F = FORMS[coll];
  const errs = [];
  F.fields.forEach(f=>{
    const v = data[f.k];
    if(f.req && !V.req(v)) errs.push(`${f.l} is required`);
    if(f.t==='number' && V.req(v)){
      const n = Number(v);
      if(!Number.isFinite(n)) errs.push(`${f.l} must be a number`);
      else{
        if(f.min!==undefined && n<f.min) errs.push(`${f.l} must be ≥ ${f.min}`);
        if(f.max!==undefined && n>f.max) errs.push(`${f.l} must be ≤ ${f.max}`);
        data[f.k] = n;
      }
    }
  });
  (DataService.raw().settings?.customFields?.[coll] || []).forEach(f=>{
    if(f.required && !V.req(data[f.id])) errs.push(`${f.label} is required`);
    if(f.type==='number' && V.req(data[f.id])) data[f.id]=Number(data[f.id]);
  });
  if(coll==='waste'){ if(data.waste > data.prepared) errs.push('Waste cannot exceed prepared qty'); }
  if(coll==='menu'){
    data.month = (data.date||'').slice(0,7);
    const dup = DataService.all('menu').find(m => m.date===data.date && m.meal===data.meal && m.id!==id);
    if(dup) errs.push('Menu for this date + meal already exists');
  }
  if(coll==='announcements'){ if(data.end < data.start) errs.push('End date must be after start date'); }
  if(errs.length){ errs.forEach(m=>toast(m,'err',3200)); return false; }

  data.updatedAt = nowISO();
  data.updatedBy = currentUser ? currentUser.username : 'public';

  if(id){ DataService.update(coll, id, data); App.audit('Update', coll, id); }
  else {
    data.createdAt = nowISO();
    data.createdBy = currentUser ? currentUser.username : 'public';
    if(coll==='complaints') data.ref = 'CMP-'+new Date().getFullYear()+'-'+String(DataService.all('complaints').length+1).padStart(4,'0');
    const rec = DataService.insert(coll, data);
    App.audit('Create', coll, rec.id||data.ref||'');
  }
  App.close(); toast('Saved successfully','ok'); renderTable(coll);
  return false;
}

function sortTimestamp(v){
  if(v===undefined || v===null || v==='') return '';
  if(typeof v === 'string') return v;
  if(typeof v === 'number') return String(v);
  if(v instanceof Date) return v.toISOString();
  if(typeof v.toMillis === 'function') return String(v.toMillis());
  if(typeof v.seconds === 'number') return String(v.seconds).padStart(12,'0') + String(v.nanoseconds||0).padStart(9,'0');
  if(typeof v._seconds === 'number') return String(v._seconds).padStart(12,'0') + String(v._nanoseconds||0).padStart(9,'0');
  try { return JSON.stringify(v); } catch(e) { return String(v); }
}
function recentTs(r){ return sortTimestamp(r && (r.updatedAt || r.createdAt || r.date || '')); }

function buildRecentOperations(reports, wasteRecs, waterRecs, breadRecs){
  const feed = [];
  [...reports].sort((a,b)=>recentTs(b).localeCompare(recentTs(a))).slice(0,5).forEach(r=>{
    feed.push({ts: r.updatedAt||r.createdAt||r.date, icon:'📝', title:`Meal Report · ${r.date} · ${reportMeal(r)}`, meta:[`${N(totalMeals(r))} meals`, money(reportRevenue(r))], tag:'reports'});
  });
  [...wasteRecs].sort((a,b)=>recentTs(b).localeCompare(recentTs(a))).slice(0,5).forEach(w=>{
    feed.push({ts: w.updatedAt||w.createdAt||w.date, icon:'🗑️', title:`Food Waste · ${w.item||'Item'}`, meta:[w.date, w.meal, `${w.waste} ${w.unit||''}`], tag:'waste'});
  });
  [...waterRecs].sort((a,b)=>recentTs(b).localeCompare(recentTs(a))).slice(0,5).forEach(w=>{
    feed.push({ts: w.updatedAt||w.createdAt||w.date, icon:'💧', title:`Water · ${w.source||'Source'}`, meta:[w.date, `${w.quantity} ${w.unit||'L'}`], tag:'water'});
  });
  [...breadRecs].sort((a,b)=>recentTs(b).localeCompare(recentTs(a))).slice(0,5).forEach(w=>{
    feed.push({ts: w.updatedAt||w.createdAt||w.date, icon:'🍞', title:`Bread Waste · ${w.breadType||'Bread'}`, meta:[w.date, `${w.quantity} ${w.unit||'Pcs'}`], tag:'breadWaste'});
  });
  feed.sort((a,b)=>sortTimestamp(b.ts).localeCompare(sortTimestamp(a.ts)));
  if(!feed.length) return '<div class="empty" style="padding:20px"><i>📭</i><p style="font-size:12px">No operations recorded</p></div>';
  return feed.slice(0,15).map(x=>`
    <div class="recent-item">
      <span class="ri-icon">${x.icon}</span>
      <div class="ri-body">
        <div class="ri-title">${esc(x.title)}</div>
        <div class="ri-meta"><span class="tag ri-tag">${esc(x.tag)}</span>${x.meta.filter(m=>m).map(m=>`<span>${esc(String(m))}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

PG.monthly = function(){
  if(!PG.monthly._month) PG.monthly._month = monthOf(TODAY);
  const m = PG.monthly._month;
  const [y,mo] = m.split('-').map(Number);
  const last = new Date(y, mo, 0);
  const days = [];
  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(y, mo-1, d);
    days.push({date: lt(dt), day: DAYS[dt.getDay()], num: d});

  const monthMenu = DataService.all('menu').filter(x=>(x.month||x.date.slice(0,7))===m);

  $('#pg').innerHTML = `
    <div class="card">
      <div class="menu-toolbar">
        <button class="btn s" onclick="IP.monthNav(-1)">‹ Previous</button>
        <input type="month" value="${m}" onchange="IP.monthSet(this.value)">

        <span class="tag">${esc(monthLabel(m))}</span>
        <button class="btn s sm" onclick="print()">🖨️ Print</button>
      </div>

        ${days.map(d=>{
          const dayMenu = monthMenu.filter(x=>x.date===d.date && x.published==='Yes');

          return `<div class="menu-day ${isToday?'today':''}">
            <div class="dhead"><span>${d.num} ${d.day}</span>${isToday?'<span class="tag" style="background:var(--ac);color:#fff">Today</span>':''}</div>

function renderMonthCompare(){
  const thisM = monthOf(TODAY);
  const lastM = addMonths(thisM, -1);
  const reports = DataService.all('reports');
  const cur = reports.filter(r=>monthOf(r.date)===thisM);
  const prev = reports.filter(r=>monthOf(r.date)===lastM);

  const sum = (arr, fn) => arr.reduce((s,r)=>s+fn(r),0);
  const meals = arr => sum(arr, r=>totalMeals(r));
  const paid = arr => sum(arr, r=>reportPaidMeals(r));
  const revenue = arr => sum(arr, r=>reportRevenue(r));
  const waste = arr => sum(arr, r=>+(+r.waste||0));
  const prep = arr => sum(arr, r=>+(+r.prepared||0));

  const wrap = (cur, prev, inverse, fmt=v=>N(v)) => deltaHtml(cur, prev, inverse, fmt);
  const bar = (cur, prev) => {
    const max = Math.max(cur, prev, 1);
    return `<div class="cc-bar"><i style="width:${(cur/max*100).toFixed(0)}%"></i></div>`;
  };

  return `
    <div class="compare-grid">
      <div class="compare-card">
        <div class="cc-title">🍽️ Meals</div>
        <div class="cc-current">${N(meals(cur))}</div>
        <div class="cc-compare">${monthLabel(lastM)}: ${N(meals(prev))}</div>
        ${wrap(meals(cur), meals(prev))}
        ${bar(meals(cur), meals(prev))}
      </div>
      <div class="compare-card">
        <div class="cc-title">💰 Paid Meals</div>
        <div class="cc-current">${N(paid(cur))}</div>
        <div class="cc-compare">${monthLabel(lastM)}: ${N(paid(prev))}</div>
        ${wrap(paid(cur), paid(prev))}
        ${bar(paid(cur), paid(prev))}
      </div>
      <div class="compare-card">
        <div class="cc-title">💵 Revenue</div>
        <div class="cc-current"><span class="tag money" style="font-size:16px">${money(revenue(cur))}</span></div>
        <div class="cc-compare">${monthLabel(lastM)}: ${money(revenue(prev))}</div>
        ${wrap(revenue(cur), revenue(prev), false, v=>money(v))}
        ${bar(revenue(cur), revenue(prev))}
      </div>
      <div class="compare-card">
        <div class="cc-title">🗑️ Waste (KG)</div>
        <div class="cc-current">${N(waste(cur))}</div>
        <div class="cc-compare">${monthLabel(lastM)}: ${N(waste(prev))}</div>
        ${wrap(waste(cur), waste(prev), true)}
        ${bar(waste(cur), waste(prev))}
      </div>
      <div class="compare-card">
        <div class="cc-title">📉 Waste %</div>
        <div class="cc-current">${prep(cur)?(waste(cur)/prep(cur)*100).toFixed(1):'0'}<small>%</small></div>
        <div class="cc-compare">${monthLabel(lastM)}: ${prep(prev)?(waste(prev)/prep(prev)*100).toFixed(1):'0'}%</div>
        ${wrap(prep(cur)?(waste(cur)/prep(cur)*100):0, prep(prev)?(waste(prev)/prep(prev)*100):0, true, v=>v.toFixed(1)+'%')}
        ${bar(waste(cur), waste(prev))}
      </div>
    </div>`;
}

PG.reports_compare = function(){
  const modes = [
    ['week','This Week vs Last Week'],
    ['month','This Month vs Last Month'],
    ['custom','Custom Range vs Previous'],
  ];
  const mode = PG.reports_compare._mode || 'week';
  PG.reports_compare._mode = mode;

  let curReports, prevReports, curLabel, prevLabel;

  if(mode === 'week'){
    const today = new Date();
    const dow = today.getDay();
    const curFrom = lt(new Date(today.getFullYear(), today.getMonth(), today.getDate()-dow));
    const curTo = lt(new Date(today.getFullYear(), today.getMonth(), today.getDate()-dow+6));
    const prevFrom = lt(new Date(today.getFullYear(), today.getMonth(), today.getDate()-dow-7));
    const prevTo = lt(new Date(today.getFullYear(), today.getMonth(), today.getDate()-dow-1));
    curReports = DataService.all('reports').filter(r=>r.date>=curFrom && r.date<=curTo);
    prevReports = DataService.all('reports').filter(r=>r.date>=prevFrom && r.date<=prevTo);
    curLabel = curFrom + ' → ' + curTo;
    prevLabel = prevFrom + ' → ' + prevTo;
  } else if(mode === 'month'){
    const thisM = monthOf(TODAY);
    const lastM = addMonths(thisM, -1);
    curReports = DataService.all('reports').filter(r=>monthOf(r.date)===thisM);
    prevReports = DataService.all('reports').filter(r=>monthOf(r.date)===lastM);
    curLabel = monthLabel(thisM);
    prevLabel = monthLabel(lastM);
  } else {
    const from = PG.reports_compare._from || ago(7);
    const to = PG.reports_compare._to || TODAY;
    const span = dateRange(from, to).length || 1;
    const prevToD = new Date(from+'T00:00:00'); prevToD.setDate(prevToD.getDate()-1);
    const prevFromD = new Date(prevToD); prevFromD.setDate(prevFromD.getDate()-(span-1));
    const prevFrom = lt(prevFromD), prevTo = lt(prevToD);
    curReports = DataService.all('reports').filter(r=>r.date>=from && r.date<=to);
    prevReports = DataService.all('reports').filter(r=>r.date>=prevFrom && r.date<=prevTo);
    curLabel = from + ' → ' + to;
    prevLabel = prevFrom + ' → ' + prevTo;
  }

  if(DF.category){
    curReports = filterReportsByCategory(curReports, DF.category);
    prevReports = filterReportsByCategory(prevReports, DF.category);
  }

  const sum = (arr, fn) => arr.reduce((s,r)=>s+fn(r),0);
  const wrap = (cur, prev, inverse, fmt=v=>N(v)) => deltaHtml(cur, prev, inverse, fmt);
  const bar = (cur, prev) => {
    const max = Math.max(cur, prev, 1);
    return `<div class="cc-bar"><i style="width:${(cur/max*100).toFixed(0)}%"></i></div>`;
  };

  const curMeals = sum(curReports, r=>totalMeals(r));
  const prevMeals = sum(prevReports, r=>totalMeals(r));
  const curPaid = sum(curReports, r=>reportPaidMeals(r));
  const prevPaid = sum(prevReports, r=>reportPaidMeals(r));
  const curRev = sum(curReports, r=>reportRevenue(r));
  const prevRev = sum(prevReports, r=>reportRevenue(r));
  const curWaste = sum(curReports, r=>+(+r.waste||0));
  const prevWaste = sum(prevReports, r=>+(+r.waste||0));
  const curPrep = sum(curReports, r=>+(+r.prepared||0));
  const prevPrep = sum(prevReports, r=>+(+r.prepared||0));
  const curWP = curPrep ? curWaste/curPrep*100 : 0;
  const prevWP = prevPrep ? prevWaste/prevPrep*100 : 0;

  const mealCats = DataService.getCats('meal');

  $('#pg').innerHTML = `
    <div class="card">
      <h3><span class="h3l">🔀 Comparison Report</span></h3>
      <div class="menu-toolbar">
        ${modes.map(([k,l])=>`<button class="btn ${mode===k?'':'s'} sm" onclick="IP.compareSetMode('${k}')">${l}</button>`).join('')}
        ${mode==='custom'?`
          <label style="margin:0">From:</label>
          <input type="date" value="${PG.reports_compare._from||ago(7)}" onchange="IP.compareSetFrom(this.value)">
          <label style="margin:0">To:</label>
          <input type="date" value="${PG.reports_compare._to||TODAY}" onchange="IP.compareSetTo(this.value)">
        `:''}
      </div>
      <div class="kpis" style="margin-bottom:0">
        <div class="kpi"><small>Current Period</small><div class="v" style="font-size:15px">${esc(curLabel)}</div><div class="sub">${curReports.length} day(s) reported</div></div>
        <div class="kpi"><small>Previous Period</small><div class="v" style="font-size:15px">${esc(prevLabel)}</div><div class="sub">${prevReports.length} day(s) reported</div></div>
      </div>
    </div>

    <div class="card">
      <h3><span class="h3l">📊 Headline Comparison</span></h3>
      <div class="compare-grid">
        <div class="compare-card">
          <div class="cc-title">🍽️ Total Meals</div>
          <div class="cc-current">${N(curMeals)}</div>
          <div class="cc-compare">Previous: ${N(prevMeals)}</div>
          ${wrap(curMeals, prevMeals)}
          ${bar(curMeals, prevMeals)}
        </div>
        <div class="compare-card">
          <div class="cc-title">💰 Paid Meals</div>
          <div class="cc-current">${N(curPaid)}</div>
          <div class="cc-compare">Previous: ${N(prevPaid)}</div>
          ${wrap(curPaid, prevPaid)}
          ${bar(curPaid, prevPaid)}
        </div>
        <div class="compare-card">
          <div class="cc-title">💵 Revenue</div>
          <div class="cc-current"><span class="tag money" style="font-size:16px">${money(curRev)}</span></div>
          <div class="cc-compare">Previous: ${money(prevRev)}</div>
          ${wrap(curRev, prevRev, false, v=>money(v))}
          ${bar(curRev, prevRev)}
        </div>
        <div class="compare-card">
          <div class="cc-title">🗑️ Waste (KG)</div>
          <div class="cc-current">${N(curWaste)}</div>
          <div class="cc-compare">Previous: ${N(prevWaste)}</div>
          ${wrap(curWaste, prevWaste, true)}
          ${bar(curWaste, prevWaste)}
        </div>
        <div class="compare-card">
          <div class="cc-title">📉 Waste %</div>

function exportExcel(coll){
  const cfg = TABLES[coll];
  const rows = DataService.all(coll).map(r=>{
    const o = {};
    (cfg?cfg.cols:Object.keys(r)).forEach(c=>{
      if(coll==='reports' && c==='revenue') o['Revenue'] = reportRevenue(r);
      else if(coll==='reports' && c==='paidMeals') o['Paid Meals'] = reportPaidMeals(r);
      else o[(cfg&&cfg.labels[c])||c] = r[c] ?? '';
    });
    return o;
  });
  if(!rows.length) return toast('No data to export','wa');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), (cfg?cfg.title:coll).slice(0,30));
  XLSX.writeFile(wb, coll+'-'+TODAY+'.xlsx');
  App.audit('Export', coll, rows.length+' rows');
  toast('Exported','ok');
}

  rateSave: (e, oldCat) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const newCat = d.cat.trim();
    const newRate = +d.rate || 0;
    if(!newCat) return toast('Name required','err'), false;
    if(oldCat){
      if(newCat !== oldCat){
        if(!DataService.renameRate(oldCat, newCat)) return toast('Name already exists','err'), false;
        DataService.editCat('paidMealCat', oldCat, newCat);
        DataService.all('reports').forEach(r=>{
          if(Array.isArray(r.paidMealsByCat)){
            let changed = false;
            r.paidMealsByCat.forEach(x=>{ if(x.category===oldCat){ x.category = newCat; changed = true; } });
            if(changed){
              const qty = r.paidMealsByCat.reduce((s,x)=>s+(+x.qty||0),0);
              const rev = r.paidMealsByCat.reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0);
              DataService.update('reports', r.id, {paidMealsByCat: r.paidMealsByCat, paidMeals: qty, revenue: rev});
            }
          }
        });
      }
      DataService.setRate(newCat, newRate);
      toast('Rate updated','ok');
    } else {
      if(DataService.getCats('paidMealCat').includes(newCat)) return toast('Already exists','err'), false;
      DataService.addCat('paidMealCat', newCat);
      DataService.setRate(newCat, newRate);
      toast('Rate added','ok');
    }
    App.close(); PG.rates();
    return false;
  },

    if(!confirm(msg)) return;
    DataService.delCat('paidMealCat', cat);

  xlMealwise: () => {
    const mealCats = DataService.getCats('meal');
    let selectedMonth = PG.reports_mealwise._month || monthOf(TODAY);
    let selectedDate  = PG.reports_mealwise._date  || '';
    let selectedMeal  = PG.reports_mealwise._meal || '';
    const filterReports = DataService.all('reports').filter(r => {
      if(selectedDate) return r.date === selectedDate && (!selectedMeal || reportMeal(r)===selectedMeal);
      return monthOf(r.date) === selectedMonth && (!selectedMeal || reportMeal(r)===selectedMeal);
    });
    const mealSummary = mealWiseSummary(filterReports);
    const wasteSummary = mealWiseFromWaste(filterReports.map(r=>r.date), selectedMeal);
    const rows = mealCats.map(m => {
      const s = mealSummary[m] || {paidQty:0, revenue:0};
      const w = wasteSummary[m] || {waste:0, prepared:0, served:0, returned:0, records:0};
      return {
        'Meal': m, 'Paid Meals': s.paidQty, 'Revenue (PKR)': Math.round(s.revenue),
        'Waste (KG)': w.waste, 'Prepared (KG)': w.prepared, 'Records': w.records,
      };
    }).filter(r => r['Paid Meals'] || r['Revenue (PKR)'] || r['Waste (KG)']);
    if(!rows.length) return toast('No data to export','wa');
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Meal-wise');
    XLSX.writeFile(wb, 'meal-wise-' + (selectedDate || selectedMonth) + '.xlsx');
    toast('Exported', 'ok');
  },

  customFields:{},

};

function v15EnsureConfig(){
  const db=DataService.raw();
  const s=db.settings||{};
  let changed=false;
  Object.entries(V15_DEFAULT_SETTINGS).forEach(([k,v])=>{
    if(s[k]===undefined){s[k]=JSON.parse(JSON.stringify(v));changed=true;}
  });
  V15_MODULES.forEach(m=>{
    if(s.moduleConfig[m.key]===undefined){s.moduleConfig[m.key]={enabled:'Yes',label:m.title,required:'No'};changed=true;}
    if(!Array.isArray(s.customFields[m.key])){s.customFields[m.key]=[];changed=true;}
  });
  if(changed){
    DataService.syncSingleton('settings',s);
  }
  return s;
}

function v15Cfg(){return v15EnsureConfig();}
function v15Enabled(key){return v15Cfg().moduleConfig?.[key]?.enabled!=='No';}
function v15Label(key){const m=V15_MODULES.find(x=>x.key===key);return v15Cfg().moduleConfig?.[key]?.label || (m?m.title:key);}
function v15CollRows(key){const m=V15_MODULES.find(x=>x.key===key);return m?DataService.all(m.coll):[];}
function v15Date(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:'';}
function v15Period(period,from,to){
  const today=TODAY, d=new Date(today+'T00:00:00');
  let a=today,b=today;
  if(period==='yesterday'){a=ago(1);b=ago(1);}
  else if(period==='week'){const x=new Date(d);x.setDate(x.getDate()-6);a=lt(x);}
  else if(period==='month'){a=today.slice(0,7)+'-01';b=today;}
  else if(period==='year'){a=today.slice(0,4)+'-01-01';b=today;}
  else if(period==='custom'){a=from||today;b=to||today;}
  return {from:a,to:b,days:dateRange(a,b)};
}
function v15InRange(date,range){return !!date && date>=range.from && date<=range.to;}
function v15Num(v){return Number(v)||0;}
function v15Sum(coll,field,range){return v15CollRows(coll).filter(r=>v15InRange(r.date,range)).reduce((s,r)=>s+v15Num(r[field]),0);}
function v15TotalMeals(range){return v15CollRows('reports').filter(r=>v15InRange(r.date,range)).reduce((s,r)=>s+totalMeals(r),0);}
function v15Paid(range){return v15CollRows('reports').filter(r=>v15InRange(r.date,range)).reduce((s,r)=>s+reportPaidMeals(r),0);}
function v15Revenue(range){return v15CollRows('reports').filter(r=>v15InRange(r.date,range)).reduce((s,r)=>s+reportRevenue(r),0);}
function v15Esc(v){return esc(v??'');}
function v15Pct(a,b){return b?((a/b)*100).toFixed(1):'0.0';}

function v15OpenModule(key){
  if(!v15Enabled(key)) return toast('This module is disabled in Configuration Center','wa');
  const m=V15_MODULES.find(x=>x.key===key); if(!m)return;
  if(key==='reports') return App.go('daily');
  if(key==='menu') return App.go('menu');
  if(key==='complaints') return App.go('complaints');
  if(key==='feedback') return App.go('feedback');
  if(key==='water') return App.go('water');
  if(key==='waste') return App.go('waste');
  if(key==='breadWaste') return App.go('bread');
  if(['inventory','vendors','purchases','hygiene','temperatures'].includes(key)) return renderTable(m.coll);
  if(key==='announcements') return App.go('announcements');
}
